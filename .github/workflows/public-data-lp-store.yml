name: Public data - LP store offers and cost indices

# Publishes the LP store offers (lp-store-offers/snapshot.json) and merges the day's
# industry cost indices (cost-indices/<systemId>.json) into R2 once a day, 00:30 UTC;
# the app reads them from https://data.neocomdesk.com. The cron is pinned to UTC
# because the cost index half stamps a UTC date. Pattern and secrets: public-data-job.yml.
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-lp-store
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/public-data-job.yml
    with:
      script: scripts/public-data/lp-store.mjs
    secrets: inherit
