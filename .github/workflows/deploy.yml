name: Deploy

# Split from ci.yml so a PR's checks never list these jobs as skipped, and so a
# push to `develop` or `main` doesn't start a CI run whose jobs all skip.
# `develop` ships to dev.neocomdesk.com; a push to `main` is a develop→main
# promotion and deploys production.
on:
  push:
    branches: [main, develop]

# One production promotion at a time, build included, queued rather than
# cancelled. The build carries retired `assets/*` over from the live site and
# the Actions cache (keep-old-assets below), so a second build that starts
# before the first deploy lands would not carry the first run's chunks, and
# tabs on that build would 404 once the second deploy replaced it. So the
# `pages` group covers the whole run on `main`. Every `develop` run gets a
# group of its own, which leaves `deploy-dev` to its own `pages-dev`
# latest-wins group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('deploy-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Build and upload the Pages artifact. Deploying from a separate job (below)
  # matters: deploy-pages looks the artifact up by listing the run's artifacts
  # once, and run in the same job straight after the upload that listing
  # sometimes comes back without it ("No artifacts named github-pages-N were
  # found", actions/deploy-pages#451). Several production deploys between
  # 2026-11-17 and 2026-11-25 needed re-runs. A job boundary between the upload
  # and the lookup is what GitHub's own Pages workflows use. It also means
  # "Re-run failed jobs" redeploys the finished artifact instead of rebuilding.
  # Needs the VITE_* / SENTRY_* values as repository variables and secrets,
  # not on the `github-pages` environment, which only `deploy` is in.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `deploy` reads these names rather than github.run_attempt: a deploy-only
    # re-run bumps run_attempt but must reuse the artifact attempt N uploaded.
    outputs:
      artifact: github-pages-${{ github.run_attempt }}
      history: asset-history-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Sentry must never be able to hold production back. The build uploads
      # source maps through the Sentry Vite plugin, and when Sentry's API
      # degrades (gateway timeouts, 2026-11-02) `sentry-cli` hangs for minutes
      # per call with no limit of its own, which stalled a deploy for 18+
      # minutes. A normal build takes about a minute, so bound the Sentry
      # build, and if it fails or times out rebuild with the token blanked
      # (the plugin and the `hidden` source maps are both gated on it): the
      # site ships without source maps for that release rather than not at all.
      # A real build error fails the rebuild too, so it is still reported.
      - name: npm run build
        shell: bash
        run: |
          if ! timeout --kill-after=10s 6m npm run build; then
            echo "::warning::Build with Sentry source-map upload failed or timed out; rebuilding without it"
            # Vite empties dist/ itself; this is belt and braces so a map from the
            # failed build can never be published.
            find dist -name '*.map' -delete 2>/dev/null || true
            SENTRY_AUTH_TOKEN= npm run build
          fi
        env:
          VITE_EVE_CLIENT_ID: ${{ vars.VITE_EVE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Source-map upload. Absent (on a fork, or before the secret is
          # added) the Sentry plugin sits out and the build is unchanged.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # A Pages deploy replaces the whole site, so a tab still on the last
      # build asked for route chunks that now 404. Carries recently retired
      # `assets/*` over from the live site (scripts/lib/assetRetention.mjs).
      # After the build, so they are never precached. Never blocks a deploy:
      # without it the site ships exactly as it did before this step.
      # The retirement history rides the Actions cache rather than being read
      # back off the site, whose CDN can serve it 10 minutes stale — longer
      # than the gap between deploys. Saved by `deploy` only once the site is
      # live, so it never records a build that did not go live.
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/asset-history.json
          key: asset-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: asset-history-
      - run: node scripts/keep-old-assets.mjs https://neocomdesk.com .cache/asset-history.json
        continue-on-error: true
      - uses: actions/configure-pages@v6
      # Named per attempt, and deploy-pages told which to read. Artifacts
      # persist across attempts within a run, so a re-run of this job used to
      # upload a second `github-pages` alongside the first and deploy-pages
      # then refused with "Multiple artifacts named github-pages ... count is
      # 2". That turned any transient failure here — an OIDC token timeout,
      # say — into one that could not be cleared by re-running, which is the
      # first thing anyone tries.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
          # Default excludes dotfiles/dotdirs, silently dropping
          # dist/.well-known/assetlinks.json (Play Store TWA verification).
          include-hidden-files: true
      # Handed to `deploy`, which saves it to the Actions cache. Best effort: a
      # missing history only means keep-old-assets reads the live site instead.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: asset-history-${{ github.run_attempt }}
          path: .cache/asset-history.json
          retention-days: 1
          if-no-files-found: ignore

  # Pages deploy for the artifact `build` uploaded. One retry as a backstop in
  # case the artifact lookup still races: the step is idempotent, and a deploy
  # that fails for a real reason fails both attempts and the job.
  # The artifact is kept 1 day, so a deploy-only re-run after that fails: use
  # "Re-run all jobs" instead.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Guards a manual re-run of an older run's deploy overlapping another
    # run's. The workflow-level `pages` group already serialises whole runs.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        continue-on-error: true
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v5
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.build.outputs.history }}
          path: .cache
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/asset-history.json
          key: asset-history-${{ github.run_id }}-${{ github.run_attempt }}

  # dev.neocomdesk.com: every merge to `develop` ships here, so the 5-7 merges
  # an hour never touch production (`build` and `deploy` above run only for `main`).
  # Cloudflare Pages by direct upload, because GitHub Pages serves one site
  # per repo. Uses the `dev` environment's own EVE application (a callback URL
  # is one per app), and sits out Sentry so dev noise stays out of production.
  # Needs, in the `dev` environment: secrets CLOUDFLARE_API_TOKEN (Pages: Edit)
  # and CLOUDFLARE_ACCOUNT_ID; variable VITE_EVE_CLIENT_ID. The custom domain
  # is attached to the project once, in the Cloudflare dashboard.
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Latest wins: a newer merge makes an in-flight dev upload pointless.
    concurrency:
      group: pages-dev
      cancel-in-progress: true
    environment:
      name: dev
      url: https://dev.neocomdesk.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: neocom-desk-dev
      # The project's production branch: an upload to it is what the custom
      # domain serves.
      PAGES_BRANCH: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: ${{ vars.VITE_EVE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      # Cloudflare Pages only does SPA rendering without a top-level 404.html;
      # why the build writes one: `spaFallbackHtml` in vite.config.ts.
      - run: rm -f dist/404.html
      # The Pages project already exists. If it is ever recreated (or PAGES_PROJECT
      # changes), create it once by hand first:
      #   npx wrangler@4 pages project create "$PAGES_PROJECT" --production-branch "$PAGES_BRANCH"
      - run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true
