name: CI

on:
  # `develop` is where work lands (PRs into it run the full gate); a push to
  # `main` is a develop→main promotion and is what deploys production.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Superseding a PR's checks is free; superseding a deploy is not. A second
# merge landing mid-deploy used to cancel the first outright, which is how
# two main runs ended up `cancelled` rather than deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `validate` used to be one serial chain of checks. They are independent, so
  # each is its own job and they run side by side; `validate` below is the
  # aggregate that keeps the context name the `develop`/`main` ruleset requires.
  check-case:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Needs no dependencies: a script over `git ls-files`.
      - run: npm run check:case

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  format-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  typecheck:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Builds once for the whole run. The `e2e-shard` jobs download this `dist/`
  # instead of each rebuilding it (one more build per shard, each after its own
  # `npm ci`). Build-time env must match what the dev-server project gets (see
  # E2E_ENV in playwright.config.ts) — these are baked into the bundle here,
  # not readable from the environment later, and blank Firebase vars are what
  # keep isSyncConfigured() false so the suite's network guard holds. The
  # variables change values only, not types or imports, so the same build also
  # answers "does the app build" for `validate`.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
          VITE_FIREBASE_API_KEY: ''
          VITE_FIREBASE_AUTH_DOMAIN: ''
          # A placeholder, not blank: a Share Link's Firestore read needs a
          # project id to build its (mocked) request — see E2E_ENV.
          VITE_FIREBASE_PROJECT_ID: neocom-e2e
          VITE_FIREBASE_APP_ID: ''
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # dist/.well-known is a dotdir; keep the artifact a faithful copy.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # functions/ is its own package, with its own lockfile, tsconfig and vitest
  # run — neither the root typecheck nor the pre-commit hook's copy of it ever
  # reads it, so without this job the Cloud Functions ship unchecked (issue
  # #595). Needs only `functions/` installed, not the root.
  functions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - run: npm run typecheck --prefix functions
      - run: npm test --prefix functions

  # The name the `develop`/`main` ruleset requires. See the `e2e` job below for the full
  # reasoning; this one aggregates the parallel jobs above instead of a matrix.
  validate:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [check-case, lint, format-check, typecheck, build, functions]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every validate job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::validate jobs did not all pass (results: ${{ join(needs.*.result, ', ') }})"
          exit 1

  test-shard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Sharded for the same reason `e2e-shard` is, and with the same shape.
    # Vitest's own summary says where the time goes: of 1250s of worker time,
    # only 40% is test callbacks — the rest is `import` (33%), `environment`
    # (13%) and `setup` (12%), all paid once per file across every test file. That
    # is work you divide, not work you speed up, and vitest defaults to
    # `cores - 1` = 3 workers on a 4-vCPU runner at 93% utilisation, so there
    # is nothing left to reclaim on one machine.
    #
    # Four, not more: vitest shards by a stable hash of the file path, and
    # replaying that split over measured per-file costs puts the worst shard
    # at 27.7% against an ideal 25%. Six splits worse (20.9% worst) for four
    # more runners. The four heavy route tests land in different shards.
    #
    # Unlike the e2e worker experiment, this adds no concurrency per machine:
    # each shard still runs vitest's default 3 workers on its own runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # setup-node caches the npm download, not node_modules; restoring the
      # tree skips the install. A miss falls back to `npm ci`.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:run -- --shard=${{ matrix.shard }}/4

  # Firestore rules tests (rules-tests/): run against the Firestore emulator,
  # which needs a JRE. Kept out of `test-shard` so `npm run test:run` never
  # needs Java. Not yet a required context in the `develop`/`main` ruleset.
  rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # setup-node caches the npm download, not node_modules; restoring the
      # tree skips the install. A miss falls back to `npm ci`.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # firebase-tools (npx's download) and the Firestore emulator jar are
      # fetched on every run otherwise. Key carries the version pinned in the
      # `test:rules` script — bump both together.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/firebase
          key: firebase-tools-14.27.0-${{ runner.os }}
      # The Corp Tax Book callable tests (functions/) run in the same emulator session.
      - run: npm ci --prefix functions
      - run: npm run test:rules

  # The name the `develop`/`main` ruleset requires. See the `e2e` job below for the full
  # reasoning — a matrix reports as `test-shard (1)`…`(4)`, none of which is
  # the required context, so this turns the shard results back into it.
  test:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [test-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every shard passed
        if: needs.test-shard.result != 'success'
        run: |
          echo "::error::test shards did not all pass (result: ${{ needs.test-shard.result }})"
          exit 1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One Pages deploy at a time, queued rather than cancelled — the
    # environment is a single shared resource and a half-applied deploy is
    # worse than a slow one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: ${{ vars.VITE_EVE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Source-map upload. Absent (on a fork, or before the secret is
          # added) the Sentry plugin sits out and the build is unchanged.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # A Pages deploy replaces the whole site, so a tab still on the last
      # build asked for route chunks that now 404. Carries recently retired
      # `assets/*` over from the live site (scripts/lib/assetRetention.mjs).
      # After the build, so they are never precached. Never blocks a deploy:
      # without it the site ships exactly as it did before this step.
      # The retirement history rides the Actions cache rather than being read
      # back off the site, whose CDN can serve it 10 minutes stale — longer
      # than the gap between deploys. Saved only once the deploy lands, so it
      # never records a build that did not go live.
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/asset-history.json
          key: asset-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: asset-history-
      - run: node scripts/keep-old-assets.mjs https://neocomdesk.com .cache/asset-history.json
        continue-on-error: true
      - uses: actions/configure-pages@v5
      # Named per attempt, and deploy-pages told which to read. Artifacts
      # persist across attempts within a run, so a re-run of this job used to
      # upload a second `github-pages` alongside the first and deploy-pages
      # then refused with "Multiple artifacts named github-pages ... count is
      # 2". That turned any transient failure here — an OIDC token timeout,
      # say — into one that could not be cleared by re-running, which is the
      # first thing anyone tries.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
          # Default excludes dotfiles/dotdirs, silently dropping
          # dist/.well-known/assetlinks.json (Play Store TWA verification).
          include-hidden-files: true
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/asset-history.json
          key: asset-history-${{ github.run_id }}-${{ github.run_attempt }}

  # dev.neocomdesk.com: every merge to `develop` ships here, so the 5-7 merges
  # an hour never touch production (`deploy` above runs only for `main`).
  # Cloudflare Pages by direct upload, because GitHub Pages serves one site
  # per repo. Uses the `dev` environment's own EVE application (a callback URL
  # is one per app), and sits out Sentry so dev noise stays out of production.
  # Needs, in the `dev` environment: secrets CLOUDFLARE_API_TOKEN (Pages: Edit)
  # and CLOUDFLARE_ACCOUNT_ID; variable VITE_EVE_CLIENT_ID. The custom domain
  # is attached to the project once, in the Cloudflare dashboard.
  deploy-dev:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Latest wins: a newer merge makes an in-flight dev upload pointless.
    concurrency:
      group: pages-dev
      cancel-in-progress: true
    environment:
      name: dev
      url: https://dev.neocomdesk.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: neocom-desk-dev
      # The project's production branch: an upload to it is what the custom
      # domain serves.
      PAGES_BRANCH: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: ${{ vars.VITE_EVE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      # Idempotent: creates the project on the first run, then finds it there.
      - run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch "$PAGES_BRANCH"
        continue-on-error: true
      - run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true

  e2e-shard:
    if: github.event_name == 'pull_request'
    needs: [build]
    runs-on: ubuntu-latest
    # Sharded because one runner could not get under the time budget. The
    # suite is ~91 specs at ~15s each — that is 21 minutes of test time, and
    # a single 4-vCPU runner spent 10.6 of them on it. The cost is almost
    # entirely each spec re-fetching the dev server's module waterfall into a
    # fresh browser context. A shard gets its own runner, and therefore its
    # own dev server and its own pair of Playwright workers, so the work
    # divides on the resource that was actually saturated. Public repo, so
    # the extra runners are free.
    #
    # Worker count is left at Playwright's default (half the cores, so 2
    # here) on purpose. Raising it to 4 was tried and does not work: four
    # Chromiums plus the dev and preview servers oversubscribe a 4-vCPU
    # runner badly enough that browsers die mid-test with `Protocol error
    # (Runtime.callFunctionOn): Internal server error, session closed`, which
    # failed 12 specs across every shard. Scale by adding runners, not by
    # crowding one.
    #
    # `fail-fast: false` so one shard's failure still lets the others report
    # theirs — otherwise a flake in shard 1 hides real breakage in shard 3.
    #
    # Eight shards, files dealt out by measured run time (see the run step).
    # Playwright's own `--shard` cut the test list into contiguous runs, so a
    # ~100-test sweep landed whole in one shard: wall time per shard ranged
    # 259s to 354s on the same suite. Eight is where the ~45s of fixed setup
    # per shard starts to eat what the extra runner saves.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Playwright's own image: Chromium and its apt libraries are baked in, so
    # there is no `playwright install --with-deps`, no apt index to go bad
    # (that failure mode cost a whole run before), and no browser cache to
    # key. The tag must match the installed @playwright/test exactly; the
    # "Check the image" step below fails with a clear message when a bump of
    # one forgets the other.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The container runs as root over a checkout owned by the runner user, so
      # git refuses the repo ("dubious ownership") and `npm ci`'s husky
      # postinstall check then reports no hook installed.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # setup-node caches the npm download, not node_modules; restoring the
      # tree skips the install. A miss falls back to `npm ci`.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-container-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Check the image matches @playwright/test
        env:
          # Keep in sync with `container.image` above.
          IMAGE_VERSION: 1.62.1
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the e2e-shard container image is v$IMAGE_VERSION; bump the image tag and IMAGE_VERSION in ci.yml together"
            exit 1
          fi
      # The `built` Playwright project renders dist/ via `vite preview`; the
      # `build` job made it, with the e2e env baked in. A downloaded file's
      # mtime says nothing about when it was built, so the preview script's
      # staleness check is off here — `dist` is by construction this commit's.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Whole files, dealt out by e2e/shard-weights.json. A file missing from
      # it counts as median, so a new spec needs no edit to run; refresh the
      # weights with `node scripts/e2e-shard.mjs --weights <ci-log>`.
      - name: Run this shard's specs
        # The container's default shell is sh, which has no `mapfile`.
        shell: bash
        run: |
          mapfile -t specs < <(node scripts/e2e-shard.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }})
          if [ "${#specs[@]}" -eq 0 ]; then echo "no specs in this shard"; exit 0; fi
          npx playwright test "${specs[@]}"
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
          E2E_PREVIEW_SKIP_STALE_CHECK: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Shard-suffixed: `upload-artifact@v4` refuses a name another job
          # already uploaded, so a fixed name turns a second failing shard
          # into a spurious upload error on top of the real failure.
          name: playwright-report-shard-${{ matrix.shard }}
          # Both, and `error` rather than the default `warn`: the traces and
          # the `error-context.md` page snapshot live under `test-results/`,
          # and this step silently uploaded nothing for as long as the config
          # had no HTML reporter to write `playwright-report/`. A failure that
          # loses its own evidence should itself fail.
          path: |
            playwright-report
            test-results
          if-no-files-found: error

  # The `main` ruleset requires a status check named exactly `e2e`, and a
  # matrix job reports as `e2e-shard (1)`, `e2e-shard (2)`, … — one context per shard,
  # none of them the required one. This job keeps that single name and turns
  # the shard results back into it. `scripts/next-ticket/drive-ci.mjs`
  # waits on the same context, so the ticket loop needs no change either.
  #
  # `!cancelled()` rather than the default: `fail-fast: false` means a failing
  # shard still lets the rest finish, and this has to run and fail afterwards
  # instead of being skipped — a skipped required check never resolves and the
  # PR waits forever.
  e2e:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      # A matrix `needs` result is `success` only when every shard succeeded,
      # so this one comparison covers failure, cancellation and a shard that
      # never started.
      - name: Fail unless every shard passed
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::e2e shards did not all pass (result: ${{ needs.e2e-shard.result }})"
          exit 1
