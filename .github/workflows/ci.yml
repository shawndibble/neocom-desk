name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseding a PR's checks is free; superseding a deploy is not. A second
# merge landing mid-deploy used to cancel the first outright, which is how
# two main runs ended up `cancelled` rather than deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # functions/ is its own package, with its own lockfile, tsconfig and
      # vitest run — neither the root typecheck above nor the pre-commit
      # hook's copy of it ever reads it, so without these steps the Cloud
      # Functions ship unchecked (issue #595).
      - run: npm ci --prefix functions
      - run: npm run typecheck --prefix functions
      - run: npm test --prefix functions

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:run

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One Pages deploy at a time, queued rather than cancelled — the
    # environment is a single shared resource and a half-applied deploy is
    # worse than a slow one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: ${{ vars.VITE_EVE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Source-map upload. Absent (on a fork, or before the secret is
          # added) the Sentry plugin sits out and the build is unchanged.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: actions/configure-pages@v5
      # Named per attempt, and deploy-pages told which to read. Artifacts
      # persist across attempts within a run, so a re-run of this job used to
      # upload a second `github-pages` alongside the first and deploy-pages
      # then refused with "Multiple artifacts named github-pages ... count is
      # 2". That turned any transient failure here — an OIDC token timeout,
      # say — into one that could not be cleared by re-running, which is the
      # first thing anyone tries.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The `built` Playwright project renders dist/ via `vite preview`, so
      # the bundle has to exist before Playwright starts. Build-time env must
      # match what the dev-server project gets (see E2E_ENV in
      # playwright.config.ts) — these are baked into the bundle here, not
      # readable from the environment later, and blank Firebase vars are what
      # keep isSyncConfigured() false so the suite's network guard holds.
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
          VITE_FIREBASE_API_KEY: ''
          VITE_FIREBASE_AUTH_DOMAIN: ''
          VITE_FIREBASE_PROJECT_ID: ''
          VITE_FIREBASE_APP_ID: ''
      - run: npx playwright test
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # Both, and `error` rather than the default `warn`: the traces and
          # the `error-context.md` page snapshot live under `test-results/`,
          # and this step silently uploaded nothing for as long as the config
          # had no HTML reporter to write `playwright-report/`. A failure that
          # loses its own evidence should itself fail.
          path: |
            playwright-report
            test-results
          if-no-files-found: error
