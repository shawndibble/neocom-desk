name: CI

on:
  # PRs into `develop` and `main` run the full gate. Deploys live in
  # deploy.yml, so a push never starts a run here whose jobs all skip.
  pull_request:
    branches: [main, develop]

# Superseding a PR's checks is free.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `validate` below aggregates `static` and `build` and keeps the
  # context name the `develop`/`main` ruleset requires.
  #
  # Runner budget: GitHub Actions runs at most 20 jobs at once across the
  # whole account (Free plan), and every job here counts against it. Parallel
  # PRs share that pool, so a job that saves no wall time is a slot another
  # PR's jobs queue for. The shard counts and job merges below are sized
  # against it.
  #
  # Caches: a PR run can restore only caches its own PR saved or ones saved on
  # its base branch or the default branch (`main`), and this workflow never
  # runs on either. cache-warm.yml saves the dependency caches there, so a PR's
  # first run hits them. It mirrors every actions/cache and setup-node cache
  # below (path, key, runner image), so change one in both places. Jobs that
  # restore node_modules don't also take setup-node's npm download cache: on a
  # hit it is a wasted download, and on a miss each PR would save its own.
  #
  # One runner for every check that is not a test shard or the build: the root
  # lint/format/typecheck/case checks, the functions/ gate, and the Firestore
  # rules tests (rules-tests/, against the emulator, which needs a JRE; kept out
  # of `test-shard` so `npm run test:run` never needs Java). Back to back they
  # take about as long as the slowest test shard, so one runner costs no wall
  # time and saves a checkout and install. `build` stays its own job: every
  # `e2e-shard` waits on its `dist/`, and a job cannot hand an artifact on
  # before it finishes.
  #
  # The functions/ gate: functions/ is its own package, with its own lockfile,
  # tsconfig and vitest run — neither the root typecheck nor the pre-commit
  # hook's copy of it ever reads it, so without these steps the Cloud
  # Functions ship unchecked (issue #595). The rules tests are merge-blocking
  # through `validate`.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # The npm download cache, for `npm ci --prefix functions` (and the
          # root install on a node_modules miss). Keyed on both lockfiles, so
          # a change to either refreshes it; cache-warm.yml saves the same key.
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Same node_modules cache as the test jobs (and warmed on `develop` by
      # cache-warm.yml); a miss falls back to `npm ci`.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # firebase-tools (npx's download) and the Firestore emulator jar are
      # fetched on every run otherwise. Key carries the version pinned in the
      # `test:rules` script — bump both together.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/firebase
          key: firebase-tools-14.27.0-${{ runner.os }}
      - run: npm ci --prefix functions
      # The checks are independent; each runs even when the one before it
      # failed, so one red result never hides the others. Still
      # `!cancelled()`, so a superseded run stops.
      - if: ${{ !cancelled() }}
        run: npm run check:case
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run format:check
      - if: ${{ !cancelled() }}
        run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run typecheck --prefix functions
      - if: ${{ !cancelled() }}
        run: npm test --prefix functions
      # The Corp Tax Book callable tests (functions/) run in the same emulator session.
      - if: ${{ !cancelled() }}
        run: npm run test:rules

  # Builds once for the whole run. The `e2e-shard` jobs download this `dist/`
  # instead of each rebuilding it (one more build per shard, each after its own
  # `npm ci`). Build-time env must match what the dev-server project gets (see
  # E2E_ENV in playwright.config.ts) — these are baked into the bundle here,
  # not readable from the environment later, and blank Firebase vars are what
  # keep isSyncConfigured() false so the suite's network guard holds. The
  # variables change values only, not types or imports, so the same build also
  # answers "does the app build" for `validate`.
  build:
    runs-on: ubuntu-latest
    # Also decides whether the e2e shards run at all (see the `e2e` job): this
    # job is already first on every PR, so it costs no extra runner.
    outputs:
      run_e2e: ${{ steps.e2e-needed.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's merge commit plus its first parent, so scripts/needs-e2e.mjs
          # can diff what the merge changes.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: e2e-needed
        run: node scripts/needs-e2e.mjs
      # Same node_modules cache as the test jobs (and warmed on `develop` by
      # cache-warm.yml); a miss falls back to `npm ci`.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # `static` already typechecks the whole tree (tsconfig.build.json is a
      # subset of it), so skip the duplicate tsc that `npm run build` runs.
      - run: npm run build:bundle
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
          VITE_FIREBASE_API_KEY: ''
          VITE_FIREBASE_AUTH_DOMAIN: ''
          # A placeholder, not blank: a Share Link's Firestore read needs a
          # project id to build its (mocked) request — see E2E_ENV.
          VITE_FIREBASE_PROJECT_ID: neocom-e2e
          VITE_FIREBASE_APP_ID: ''
      # No shards, no consumer of `dist`.
      - uses: actions/upload-artifact@v4
        if: steps.e2e-needed.outputs.run_e2e == 'true'
        with:
          name: dist
          path: dist
          # dist/.well-known is a dotdir; keep the artifact a faithful copy.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The name the `develop`/`main` ruleset requires. See the `e2e` job below for the full
  # reasoning; this one aggregates `static` and `build` above instead of
  # a matrix.
  validate:
    if: ${{ !cancelled() }}
    needs: [static, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every validate job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::validate jobs did not all pass (results: ${{ join(needs.*.result, ', ') }})"
          exit 1

  # Decides whether the `test-shard` jobs run at all: a docs-only PR has
  # nothing for vitest to check (scripts/lib/testRelevance.mjs). Its own tiny
  # job rather than a step in `build`, so the shards do not wait on the bundle.
  tests-needed:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.tests-needed.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's merge commit plus its first parent, so scripts/needs-tests.mjs
          # can diff what the merge changes.
          fetch-depth: 2
      - id: tests-needed
        run: node scripts/needs-tests.mjs

  test-shard:
    needs: [tests-needed]
    # Docs-only PRs skip the four shards; the `test` job below still reports.
    if: needs.tests-needed.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    # Sharded for the same reason `e2e-shard` is, and with the same shape.
    # Vitest's own summary says where the time goes: of 1250s of worker time,
    # only 40% is test callbacks — the rest is `import` (33%), `environment`
    # (13%) and `setup` (12%), all paid once per file across every test file. That
    # is work you divide, not work you speed up, and vitest defaults to
    # `cores - 1` = 3 workers on a 4-vCPU runner at 93% utilisation, so there
    # is nothing left to reclaim on one machine.
    #
    # Four, not more: vitest shards by a stable hash of the file path, and
    # replaying that split over measured per-file costs puts the worst shard
    # at 27.7% against an ideal 25%. Six splits worse (20.9% worst) for four
    # more runners. The four heavy route tests land in different shards.
    #
    # Unlike the e2e worker experiment, this adds no concurrency per machine:
    # each shard still runs vitest's default 3 workers on its own runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Restoring node_modules skips the install (see "Caches" at the top);
      # a miss falls back to `npm ci`.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:run -- --shard=${{ matrix.shard }}/4

  # The name the `develop`/`main` ruleset requires. See the `e2e` job below for the full
  # reasoning — a matrix reports as `test-shard (1)`…`(4)`, none of which is
  # the required context, so this turns the shard results back into it.
  test:
    if: ${{ !cancelled() }}
    needs: [tests-needed, test-shard]
    runs-on: ubuntu-latest
    steps:
      # A matrix `needs` result is `success` only when every shard succeeded.
      # The one accepted `skipped` is `tests-needed` having decided nothing in
      # the PR can affect vitest; a skip for any other reason still fails here.
      - name: Fail unless every shard passed
        if: needs.test-shard.result != 'success' && !(needs.test-shard.result == 'skipped' && needs.tests-needed.result == 'success' && needs.tests-needed.outputs.run_tests == 'false')
        run: |
          echo "::error::test shards did not all pass (shards: ${{ needs.test-shard.result }}, tests-needed: ${{ needs.tests-needed.result }})"
          exit 1

  e2e-shard:
    needs: [build]
    # Docs-, backend- and test-only PRs skip the six shards (see
    # scripts/lib/e2eRelevance.mjs); the `e2e` job below still reports.
    if: needs.build.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    # Sharded because one runner could not get under the time budget. The
    # suite is ~91 specs at ~15s each — that is 21 minutes of test time, and
    # a single 4-vCPU runner spent 10.6 of them on it. The cost is almost
    # entirely each spec re-fetching the dev server's module waterfall into a
    # fresh browser context. A shard gets its own runner, and therefore its
    # own dev server and its own pair of Playwright workers, so the work
    # divides on the resource that was actually saturated. Public repo, so
    # the extra runners cost no minutes, only slots (see "Runner budget").
    #
    # Worker count is left at Playwright's default (half the cores, so 2
    # here) on purpose. Raising it to 4 was tried and does not work: four
    # Chromiums plus the dev and preview servers oversubscribe a 4-vCPU
    # runner badly enough that browsers die mid-test with `Protocol error
    # (Runtime.callFunctionOn): Internal server error, session closed`, which
    # failed 12 specs across every shard. Scale by adding runners, not by
    # crowding one.
    #
    # `fail-fast: false` so one shard's failure still lets the others report
    # theirs — otherwise a flake in shard 1 hides real breakage in shard 3.
    #
    # Files are dealt out by measured run time (see the run step).
    # Playwright's own `--shard` cut the test list into contiguous runs, so a
    # ~100-test sweep landed whole in one shard: wall time per shard ranged
    # 259s to 354s on the same suite.
    #
    # Six shards, down from eight, for the runner budget (top of file): eight
    # plus `static` and the four `test-shard`s held up to 13 runners
    # per PR at the peak, so two PRs in flight queued. The e2e path isn't the
    # critical one: shards start ~100s in (after `build`) and ran ~160–300s
    # at eight, while `test-shard` runs ~370–410s from the start. Six run
    # ~270–330s each, which keeps them at or near that window; fewer would
    # make e2e the long pole of every PR.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # Playwright's own image: Chromium and its apt libraries are baked in, so
    # there is no `playwright install --with-deps`, no apt index to go bad
    # (that failure mode cost a whole run before), and no browser cache to
    # key. The tag must match the installed @playwright/test exactly; the
    # "Check the image" step below fails with a clear message when a bump of
    # one forgets the other.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The container runs as root over a checkout owned by the runner user, so
      # git refuses the repo ("dubious ownership") and `npm ci`'s husky
      # `prepare` check then reports no hook installed.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Restoring node_modules skips the install (see "Caches" at the top);
      # a miss falls back to `npm ci`.
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: node-modules-container-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Check the image matches @playwright/test
        env:
          # Keep in sync with `container.image` above (and cache-warm.yml's).
          IMAGE_VERSION: 1.62.1
        run: |
          installed="$(node -p "require('@playwright/test/package.json').version")"
          if [ "$installed" != "$IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but the e2e-shard container image is v$IMAGE_VERSION; bump the image tag and IMAGE_VERSION in ci.yml (and the image in cache-warm.yml) together"
            exit 1
          fi
      # The `built` Playwright project renders dist/ via `vite preview`; the
      # `build` job made it, with the e2e env baked in. A downloaded file's
      # mtime says nothing about when it was built, so the preview script's
      # staleness check is off here — `dist` is by construction this commit's.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Whole files, dealt out by e2e/shard-weights.json. A file missing from
      # it counts as median, so a new spec needs no edit to run; refresh the
      # weights with `node scripts/e2e-shard.mjs --weights <ci-log>`.
      - name: Run this shard's specs
        # The container's default shell is sh, which has no `mapfile`.
        shell: bash
        run: |
          mapfile -t specs < <(node scripts/e2e-shard.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }})
          if [ "${#specs[@]}" -eq 0 ]; then echo "no specs in this shard"; exit 0; fi
          # The Vite dev server only serves the `*.dev.spec.ts` files; skip
          # booting it on a shard that has none (see playwright.config.ts).
          if printf '%s\n' "${specs[@]}" | grep -q '\.dev\.spec\.ts$'; then export E2E_NEEDS_DEV=1; fi
          npx playwright test "${specs[@]}"
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
          E2E_PREVIEW_SKIP_STALE_CHECK: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Shard-suffixed: `upload-artifact@v4` refuses a name another job
          # already uploaded, so a fixed name turns a second failing shard
          # into a spurious upload error on top of the real failure.
          name: playwright-report-shard-${{ matrix.shard }}
          # Both, and `error` rather than the default `warn`: the traces and
          # the `error-context.md` page snapshot live under `test-results/`,
          # and this step silently uploaded nothing for as long as the config
          # had no HTML reporter to write `playwright-report/`. A failure that
          # loses its own evidence should itself fail.
          path: |
            playwright-report
            test-results
          if-no-files-found: error

  # The `main` ruleset requires a status check named exactly `e2e`, and a
  # matrix job reports as `e2e-shard (1)`, `e2e-shard (2)`, … — one context per shard,
  # none of them the required one. This job keeps that single name and turns
  # the shard results back into it. `scripts/next-ticket/drive-ci.mjs`
  # waits on the same context, so the ticket loop needs no change either.
  #
  # `!cancelled()` rather than the default: `fail-fast: false` means a failing
  # shard still lets the rest finish, and this has to run and fail afterwards
  # instead of being skipped — a skipped required check never resolves and the
  # PR waits forever.
  e2e:
    if: ${{ !cancelled() }}
    needs: [build, e2e-shard]
    runs-on: ubuntu-latest
    steps:
      # A matrix `needs` result is `success` only when every shard succeeded,
      # so this one comparison covers failure, cancellation and a shard that
      # never started. The one accepted `skipped` is `build` having decided
      # nothing in the PR can affect e2e; a skip for any other reason (build
      # failed, so no output) still fails here.
      - name: Fail unless every shard passed
        if: needs.e2e-shard.result != 'success' && !(needs.e2e-shard.result == 'skipped' && needs.build.result == 'success' && needs.build.outputs.run_e2e == 'false')
        run: |
          echo "::error::e2e shards did not all pass (shards: ${{ needs.e2e-shard.result }}, build: ${{ needs.build.result }})"
          exit 1
