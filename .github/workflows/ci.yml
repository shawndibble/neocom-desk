name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseding a PR's checks is free; superseding a deploy is not. A second
# merge landing mid-deploy used to cancel the first outright, which is how
# two main runs ended up `cancelled` rather than deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # functions/ is its own package, with its own lockfile, tsconfig and
      # vitest run — neither the root typecheck above nor the pre-commit
      # hook's copy of it ever reads it, so without these steps the Cloud
      # Functions ship unchecked (issue #595).
      - run: npm ci --prefix functions
      - run: npm run typecheck --prefix functions
      - run: npm test --prefix functions

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:run

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One Pages deploy at a time, queued rather than cancelled — the
    # environment is a single shared resource and a half-applied deploy is
    # worse than a slow one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: ${{ vars.VITE_EVE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # Source-map upload. Absent (on a fork, or before the secret is
          # added) the Sentry plugin sits out and the build is unchanged.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - uses: actions/configure-pages@v5
      # Named per attempt, and deploy-pages told which to read. Artifacts
      # persist across attempts within a run, so a re-run of this job used to
      # upload a second `github-pages` alongside the first and deploy-pages
      # then refused with "Multiple artifacts named github-pages ... count is
      # 2". That turned any transient failure here — an OIDC token timeout,
      # say — into one that could not be cleared by re-running, which is the
      # first thing anyone tries.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  e2e-shard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Sharded because one runner could not get under the time budget. The
    # suite is ~91 specs at ~15s each — that is 21 minutes of test time, and
    # a single 4-vCPU runner spent 10.6 of them on it. The cost is almost
    # entirely each spec re-fetching the dev server's module waterfall into a
    # fresh browser context, and that server is one single-threaded Node
    # process, so widening workers alone hits its ceiling fast. A shard gets
    # its own runner and therefore its own dev server, which is the part that
    # actually scales. Public repo, so the extra runners are free.
    #
    # `fail-fast: false` so one shard's failure still lets the others report
    # theirs — otherwise a flake in shard 1 hides real breakage in shard 3.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium comes from Playwright's own CDN; the only thing `--with-deps`
      # needs apt for is Ubuntu's shared libraries. The runner image ships
      # Google's Chrome repo regardless, so `apt-get update` fetches an index
      # this job never uses — and when that index is bad it fails the whole
      # step (`Hash Sum mismatch`, exit 100) in ~40s, before a browser exists
      # and before a single test runs. Dropping the source list removes a
      # dependency on a server we were not using.
      #
      # Nothing here consumes it: playwright.config.ts uses
      # `devices['Desktop Chrome']`, which picks a viewport and user agent, not
      # `channel: 'chrome'`. A project that did ask for a real-Chrome channel
      # would need this reconsidered.
      #
      # The retry below is the residual net — an Ubuntu archive wobble, or a
      # failure fetching the browser itself — neither of which the line above
      # covers.
      - name: Install Playwright browsers
        # A retry loop turns one hung install into three, and the job default
        # is six hours.
        timeout-minutes: 10
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            # Nothing follows the last attempt, so it neither sleeps nor claims
            # it is about to retry.
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "::warning::playwright install failed (attempt $attempt/3), retrying"
            # The index specifically: a bad one is otherwise reused and the
            # retry fails identically. `apt-get clean` is not used — it empties
            # the .deb cache, which is not what goes wrong here.
            sudo rm -rf /var/lib/apt/lists/* || true
            sleep $((attempt * 20))
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1
      # The `built` Playwright project renders dist/ via `vite preview`, so
      # the bundle has to exist before Playwright starts. Build-time env must
      # match what the dev-server project gets (see E2E_ENV in
      # playwright.config.ts) — these are baked into the bundle here, not
      # readable from the environment later, and blank Firebase vars are what
      # keep isSyncConfigured() false so the suite's network guard holds.
      - run: npm run build
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
          VITE_FIREBASE_API_KEY: ''
          VITE_FIREBASE_AUTH_DOMAIN: ''
          VITE_FIREBASE_PROJECT_ID: ''
          VITE_FIREBASE_APP_ID: ''
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          VITE_EVE_CLIENT_ID: e2e-fake-client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Shard-suffixed: `upload-artifact@v4` refuses a name another job
          # already uploaded, so a fixed name turns a second failing shard
          # into a spurious upload error on top of the real failure.
          name: playwright-report-shard-${{ matrix.shard }}
          # Both, and `error` rather than the default `warn`: the traces and
          # the `error-context.md` page snapshot live under `test-results/`,
          # and this step silently uploaded nothing for as long as the config
          # had no HTML reporter to write `playwright-report/`. A failure that
          # loses its own evidence should itself fail.
          path: |
            playwright-report
            test-results
          if-no-files-found: error

  # The `main` ruleset requires a status check named exactly `e2e`, and a
  # matrix job reports as `e2e-shard (1)`, `e2e-shard (2)`, … — four contexts,
  # none of them the required one. This job keeps that single name and turns
  # the four shard results back into it. `scripts/next-ticket/drive-ci.mjs`
  # waits on the same context, so the ticket loop needs no change either.
  #
  # `!cancelled()` rather than the default: `fail-fast: false` means a failing
  # shard still lets the rest finish, and this has to run and fail afterwards
  # instead of being skipped — a skipped required check never resolves and the
  # PR waits forever.
  e2e:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [e2e-shard]
    runs-on: ubuntu-latest
    steps:
      # A matrix `needs` result is `success` only when every shard succeeded,
      # so this one comparison covers failure, cancellation and a shard that
      # never started.
      - name: Fail unless every shard passed
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::e2e shards did not all pass (result: ${{ needs.e2e-shard.result }})"
          exit 1
