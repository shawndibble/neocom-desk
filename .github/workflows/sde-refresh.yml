name: SDE refresh

# Nightly: when CCP's export and Fuzzwork's dump agree on a game build newer
# than the baked one (scripts/sde-build.json), rebake public/data and open a
# PR that auto-merges once CI is green. A red PR waits for a human.
#
# Needs secret SDE_REFRESH_TOKEN: a fine-grained token on this repo with
# Contents and Pull requests read/write. A PR opened with GITHUB_TOKEN never
# starts CI, so it would never merge.
on:
  schedule:
    # CCP has shipped mid-morning UTC and Fuzzwork ~2 h later; this catches
    # the previous day's build either way.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sde-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HUSKY: '0'
    steps:
      - name: Require the refresh token
        env:
          SDE_REFRESH_TOKEN: ${{ secrets.SDE_REFRESH_TOKEN }}
        run: |
          if [ -z "$SDE_REFRESH_TOKEN" ]; then
            echo "::error::Secret SDE_REFRESH_TOKEN is not set (see this workflow's header)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDE_REFRESH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check for a new game build
        id: check
        run: |
          node scripts/sde-check.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Skip a build that already has a PR branch
        id: branch
        if: steps.check.outputs.update == 'true'
        run: |
          name="sde/build-${{ steps.check.outputs.build }}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$name" > /dev/null; then
            echo "Branch $name already exists; its PR is pending."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.update == 'true' && steps.branch.outputs.exists != 'true'
        run: npm ci
      # Keyed by build: the CCP zip and Fuzzwork CSVs are cached under
      # build-numbered names, and a new build never needs an old one's.
      - if: steps.check.outputs.update == 'true' && steps.branch.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/sde
          key: sde-${{ steps.check.outputs.build }}
      - name: Rebake
        if: steps.check.outputs.update == 'true' && steps.branch.outputs.exists != 'true'
        run: |
          node scripts/build-sde.mjs
          npx prettier --write functions/src/data
      - name: Open an auto-merging PR
        if: steps.check.outputs.update == 'true' && steps.branch.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.SDE_REFRESH_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BUILD: ${{ steps.check.outputs.build }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -A public/data functions/src/data scripts/sde-build.json
          if git diff --cached --quiet; then
            echo "Build $BUILD changed no baked data."
            exit 0
          fi
          git commit -m "chore(sde): rebake game data for build $BUILD"
          git push origin "$BRANCH"
          {
            echo "Nightly SDE refresh: $REASON."
            echo
            echo '```'
            git diff --stat HEAD~1 HEAD
            echo '```'
            echo
            echo 'Auto-merges once CI is green. If CI fails, the new data broke something: fix it on this branch.'
          } > body.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore(sde): rebake game data for build $BUILD" --body-file body.md
          gh pr merge "$BRANCH" --auto --squash
      - name: Report a failed refresh
        if: failure()
        run: |
          gh label create sde-refresh --description "Nightly SDE refresh failed" --color D93F0B || true
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --label sde-refresh --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $url"
          else
            gh issue create --title "Nightly SDE refresh failed" --label sde-refresh \
              --body "The nightly game-data refresh failed: $url"
          fi
