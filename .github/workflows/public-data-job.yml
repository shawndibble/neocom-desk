name: Public data job (reusable)

# The runner pattern for jobs that fetch public data and publish JSON to R2
# (https://data.neocomdesk.com), instead of running as a Cloud Function on a
# Cloud Scheduler job. The repo is public, so runner minutes are free.
#
# To add a job: write `scripts/public-data/<job>.mjs` (imports its module from
# `functions/lib`, reads settings from env, exits non-zero on failure) and a
# one-job workflow `public-data-<job>.yml` that calls this one:
#
#   jobs:
#     run:
#       uses: ./.github/workflows/public-data-job.yml
#       with: { script: scripts/public-data/<job>.mjs }
#       secrets: inherit
#
# Needs repository secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT
# and R2_BUCKET (the values the functions use: GCP Secret Manager and
# functions/.env). Scheduled workflows run only from `main`.
#
# A job must send X-Compatibility-Date and a descriptive X-User-Agent on ESI
# calls, stop on X-Ratelimit-* / Retry-After (runner IPs are shared), keep any
# state it needs as an R2 object next to its output, and set a Cache-Control
# that suits its cadence. Reuse functions/src (r2Client.ts, esiNotifications.ts
# constants), never copy it.
on:
  workflow_call:
    inputs:
      script:
        description: Entry script, relative to the repo root
        required: true
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_ENDPOINT:
        required: false
      R2_BUCKET:
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Require the R2 secrets
        run: |
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (see .github/workflows/public-data-job.yml)."
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Build the functions code
        run: |
          npm ci --prefix functions
          npm run build --prefix functions
      - name: Run the job
        env:
          SCRIPT: ${{ inputs.script }}
        run: node "$SCRIPT"
