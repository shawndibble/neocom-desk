name: Keep scheduled workflows enabled

# GitHub disables a public repo's scheduled workflows after 60 days with no
# repository activity. Once a month this re-enables every workflow in
# .github/workflows through the API instead of committing (develop and main
# only take PRs, and a push to develop deploys). GitHub doesn't document that
# enabling an active workflow resets the clock (community keepalive actions rely
# on it), so a workflow found auto-disabled is re-enabled and flagged as a
# warning on the run. A workflow someone turned off by hand stays off. This one
# re-enables itself too.
on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-enable workflows
        shell: bash
        run: |
          # Listed first, not via process substitution, so a failed call fails the job.
          workflows=$(gh api --paginate "repos/$GH_REPO/actions/workflows" \
            --jq '.workflows[] | select((.path | startswith(".github/workflows/")) and .state != "disabled_manually" and .state != "deleted") | [.id, .path, .state] | @tsv')
          if [ -z "$workflows" ]; then
            echo "::error::No workflows to enable"
            exit 1
          fi
          failed=0
          while IFS=$'\t' read -r id path state; do
            if gh api --silent -X PUT "repos/$GH_REPO/actions/workflows/$id/enable" </dev/null; then
              echo "Enabled $path (was $state)"
              if [ "$state" = "disabled_inactivity" ]; then
                echo "::warning::$path had been disabled for inactivity"
              fi
            else
              echo "::error::Could not enable $path"
              failed=1
            fi
          done <<< "$workflows"
          exit "$failed"
