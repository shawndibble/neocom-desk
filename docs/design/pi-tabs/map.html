<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PI Map</title>
<link rel="stylesheet" href="tokens.css">
<script src="data.js"></script>
<script src="calc.js"></script>
<script src="icons.js"></script>
<style>
/* Neocom Desk design rules (DESIGN-RULES.md): boxes = clickable; Panel is the only bordered display container; radius 2px; no gradients/glows. Map keeps its icons, planet images and colour. */
:root{--gold:#f5b94a;--path:#57c7f4;--new:#ff79c6;--hs:#5fd584;--ls:#f5b94a;--ns:#ff7369;font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif}
body{min-height:100vh;font-size:14px}
a{color:var(--accent)}
.app{padding-top:12px;padding-bottom:40px;display:flex;flex-direction:column;gap:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dim{color:var(--text-dim)}.faint{color:var(--text-faint)}
/* ---- primitives ---- */
.panel{background:rgba(17,22,29,.85);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:2px;padding:0}
.ph{min-height:36px;padding:4px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph h2,.ph h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.ph .meta{font-size:11px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pb{padding:12px}
.micro{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:12px 0 6px}
.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--line-bright);background:var(--panel-2)}
.btn.accent{border-color:var(--accent);color:var(--accent)}.btn.accent:hover{background:rgba(87,199,244,.1)}
.btn.md{height:36px;padding:0 16px;font-size:12px}
.textact{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:none;border:0;padding:0;height:auto;cursor:pointer}
.textact:hover{text-decoration:underline}
.ilink{color:var(--accent);font-weight:500;text-decoration:underline;cursor:pointer}
.stats{display:flex;flex-wrap:wrap;align-items:center;row-gap:2px}
.st{display:inline-flex;align-items:center;gap:6px;height:28px;font-size:11px;white-space:nowrap;padding-left:12px;margin-left:12px;position:relative}
.st:first-child{padding-left:0;margin-left:0}
.st:not(:first-child)::before{content:"";position:absolute;left:0;top:7px;width:1px;height:14px;background:var(--line)}
.st .l{font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.st .v{font-weight:500;font-variant-numeric:tabular-nums;color:var(--text)}
.st .v.pos{color:var(--isk-pos)}.st .v.warn{color:var(--warning)}
.tag18{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--line);border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.tag18.est{border-color:rgba(245,185,74,.6);color:var(--warning)}
.tag18.pick{border-color:rgba(245,185,74,.6);color:var(--warning)}
.tag18.stop{border-color:rgba(245,185,74,.45);background:rgba(245,185,74,.1);color:var(--warning)}
.tag18.add{border-color:rgba(87,199,244,.45);background:rgba(87,199,244,.1);color:var(--accent)}
.tier{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid var(--line);background:var(--panel-2);border-radius:2px;font-size:11px;color:var(--text-dim);font-weight:600}
.cmp{font-size:11px;font-weight:600;color:var(--text-dim)}
.cmp.better{color:var(--success)}.cmp.worse{color:var(--danger)}
.ar{color:var(--text-dim)}
.est{font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.4}
.hair{border-top:1px solid var(--line)}
/* ---- mock + context ---- */
.mock{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px;border:1px dashed var(--line-bright);border-radius:2px;font-size:12px;color:var(--text-dim)}
.mock #pilotsw{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.fchip:hover{border-color:var(--line-bright);color:var(--text)}
.fchip.on{border-color:var(--accent-dim);background:rgba(87,199,244,.15);color:var(--accent)}
.ctx select{height:28px;padding:0 8px;font-size:12px;border:1px solid var(--line-bright);background:var(--panel-2);color:var(--text);border-radius:2px;text-transform:none;letter-spacing:0;font-weight:400}
.sec{font-weight:600;font-variant-numeric:tabular-nums}
/* ---- guidance panel ---- */
.guide{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.1fr);font-size:12px;color:var(--text-dim);line-height:1.45}
.guide>div{padding:10px 12px}
.guide>div+div{border-left:1px solid var(--line)}
.guide .g b{display:block;color:var(--text);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.guide .g b span{color:var(--accent);margin-right:4px}
.guide .learn a{display:block;margin:3px 0;font-weight:500}
/* ---- segmented control (question) ---- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;max-width:100%}
.seg button{height:36px;padding:0 12px;border:0;border-left:1px solid var(--line);border-radius:0;background:transparent;color:var(--text-dim);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--panel-2);color:var(--text)}
.seg button.on{background:rgba(87,199,244,.15);color:var(--accent)}
.qrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qrow .hint{font-size:12px;color:var(--text-dim)}
.specific{margin-left:auto;font-size:12px;color:var(--text-dim)}
/* ---- layout ---- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.layout.docked{grid-template-columns:minmax(0,1fr) 360px}
.layout:not(.docked)>.side{display:none}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;text-transform:none;letter-spacing:0;font-weight:400}
.legend i{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:5px;vertical-align:0}
.whatif{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-dim);flex-wrap:wrap}
.whatif .wi{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.whatif.on .wi{color:var(--new)}
.whatif.on{color:var(--text)}
.whatif .icons{display:flex;gap:2px;flex-wrap:wrap}
.whatif .icons img{width:22px;height:22px}
.whatif img.wp{width:28px;height:28px;border-radius:50%}
/* ---- map ---- */
.mapwrap{position:relative;padding:12px 12px 12px 0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain}
.map{position:relative;display:grid;grid-template-columns:72px 116px 146px 196px 184px 194px;column-gap:16px;width:max-content;margin:0 auto}
.map svg.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.col{position:relative;display:flex;flex-direction:column}
.col.planets{position:sticky;left:0;z-index:3;background:#10151c;padding-left:12px;box-sizing:content-box;box-shadow:1px 0 0 var(--line)}
.colhead{height:52px}
.planets .colhead .t{gap:4px}
.colhead .t{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text);display:flex;align-items:center;gap:6px}
.colhead .s{font-size:11px;color:var(--text-dim);line-height:1.25;margin-top:3px}
.ibtn{height:16px;width:16px;min-width:16px;padding:0;border-radius:50%;font-size:10px;font-weight:600;line-height:14px;text-align:center;border:1px solid var(--line);color:var(--text-dim);background:transparent;cursor:pointer}
.ibtn:hover{border-color:var(--line-bright);color:var(--text)}
.items{flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}






.it{flex:none;position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) auto;column-gap:6px;align-items:center;height:34px;padding:0 5px 0 3px;border-radius:2px;cursor:pointer;font-size:12px;border:1px solid var(--line);background:var(--panel-2)}
.it img{width:24px;height:24px}
.it .nm{white-space:normal;line-height:13px;min-width:0;overflow-wrap:normal;word-break:normal}
.it .sub{display:flex;align-items:center;gap:4px;font-size:11px;line-height:13px;font-variant-numeric:tabular-nums;color:var(--text)}
.it .sub b{font-weight:600}
.sym{font-size:10px;line-height:11px;font-weight:700}
.sym.better{color:var(--success)}.sym.same{color:var(--text-dim)}.sym.worse{color:var(--danger)}
.it:hover{border-color:var(--line-bright)}
.it.dim{opacity:.3}
.it.ghost{background:rgba(22,29,39,.35);border-color:transparent;cursor:default}
.it.ghost>*{visibility:hidden}
.it.path{background:rgba(87,199,244,.12);border-color:var(--accent-dim)}
.it.path .nm{color:var(--text);font-weight:600}
.it.goal{background:rgba(245,185,74,.12);border-color:var(--gold)}
.it.new{opacity:1;background:rgba(255,121,198,.12);border-color:var(--new)}
.it.new>*{visibility:visible}
.it .rank{position:absolute;width:max-content;justify-self:start;left:-15px;top:50%;transform:translateY(-50%);height:18px;min-width:22px;padding:0 3px;border-radius:2px;background:var(--gold);color:var(--bg);font-size:11px;font-weight:700;display:grid;place-items:center;z-index:2}
.it .rank.alt{background:var(--bg);color:var(--gold);border:1px solid var(--gold)}
/* planets (toggle buttons) */
.planets .items{justify-content:space-between;gap:0;padding:0}





.pl{display:flex;flex-direction:column;align-items:center;gap:3px;width:72px;cursor:pointer;border-radius:2px;padding:3px 0;position:relative;border:1px solid transparent;height:auto;background:transparent;color:var(--text);font:inherit}
.pl img{width:40px;height:40px;flex:none;border-radius:50%;outline:2px solid transparent;outline-offset:1px}
.pl .pn{font-size:11px;font-weight:600;line-height:13px}
.pl .box{position:absolute;top:2px;right:6px;width:14px;height:14px;border-radius:2px;border:1px solid var(--line-bright);background:var(--panel-2);display:grid;place-items:center;font-size:10px;line-height:1;color:var(--accent-contrast)}
.pl .tag{display:inline-flex;align-items:center;height:14px;padding:0 3px;border:1px solid var(--line);border-radius:2px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.pl .ptag:empty{display:none}
.pl.on .box{background:var(--accent);border-color:var(--accent)}
.pl.off img{filter:grayscale(1) brightness(.45)}
.pl.off .pn{color:var(--text-dim)}
.pl:hover{border-color:var(--line-bright);background:var(--panel-2)}
.pl.off:hover img,.pl.off.hov img{filter:none;outline-color:var(--new)}
.pl.on.extra img{outline-color:var(--new)}
.pl.use img{outline-color:var(--gold)}
.pl.need img{filter:none;outline-color:var(--danger)}

.tag.have{color:var(--success);border-color:rgba(95,213,132,.5)}.tag.need{color:var(--danger);border-color:rgba(255,115,105,.5)}.tag.use{color:var(--gold);border-color:rgba(245,185,74,.6)}.tag.wi{color:var(--new);border-color:rgba(255,121,198,.6)}
/* wires */
.w{fill:none;stroke:#2c3a4b;stroke-width:1;opacity:.55}
.w.lit{stroke:#3f5a74;opacity:.85}
.w.dim{opacity:.1}
.w.path{stroke:var(--path);stroke-width:2;opacity:1}
.w.pp{stroke:var(--gold);stroke-width:2;opacity:1}
.w.nw{stroke:var(--new);stroke-width:1.2;opacity:.5}
/* ---- side panels ---- */
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.card{background:rgba(17,22,29,.85);border:1px solid var(--line);border-radius:2px;padding:0 12px 12px}
.card>h3:first-child{margin:0 -12px 12px;min-height:36px;padding:4px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.card>h3:not(:first-child){font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:14px 0 6px}
.card>h3 .xbtn{margin-left:auto}
.pick{display:flex;align-items:center;gap:12px}
.pick img.big{width:48px;height:48px}
.pname{font-size:16px;font-weight:600;line-height:1.25}
.big-isk{font-size:30px;font-weight:600;color:var(--isk-pos);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:10px}
.big-isk small{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-left:4px}
.story{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin:8px 0 4px;font-size:12px;line-height:1.6}
.story .pi{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.story .pi img{width:20px;height:20px;border-radius:50%}
.story .ii img,.story img{width:20px;height:20px;vertical-align:-5px}
.effort{margin-top:8px}
.alts{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.alt{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--text);font-size:12px;text-align:left;cursor:pointer;width:100%}
.alt:hover{background:var(--panel-2)}
.alt.on{background:rgba(87,199,244,.12);box-shadow:inset 2px 0 0 var(--accent)}
.alt img{width:22px;height:22px;flex:none}
.alt .rk{font-weight:700;color:var(--gold);font-size:11px;min-width:18px}
.alt .gn{font-size:12px;color:var(--isk-pos);font-variant-numeric:tabular-nums}
.alt .lbl{min-width:0;flex:1;display:flex;justify-content:space-between;gap:8px;overflow:hidden}
.alt .lbl div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt::after{content:"›";color:var(--text-dim);font-size:16px}
.todo{display:flex;flex-direction:column}
.todo .pc{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.todo .pc:first-child{border-top:0;padding-top:0}
.todo .pc>img{width:32px;height:32px;border-radius:50%}
.todo .pc .h{font-weight:600;font-size:12px}
.todo .pc .h small{font-weight:400;color:var(--text-dim)}
.todo ol{margin:4px 0 0;padding-left:18px;font-size:12px;line-height:1.7}
.todo ol img{width:18px;height:18px;vertical-align:-4px;margin-right:3px}
.todo .stop{color:var(--text-dim);text-decoration:line-through}
.keep{font-size:12px;color:var(--text-dim);display:flex;flex-direction:column}
.keep span{display:flex;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.keep img{width:18px;height:18px;border-radius:50%}
.blist{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto 10px;gap:8px;align-items:center;height:36px;padding:0 4px;cursor:pointer;font-size:12px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow::after{content:"›";color:var(--text-dim)}
.brow>span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow:hover{background:var(--panel-2)}
.brow img{width:24px;height:24px}
.brow .pls{display:flex;gap:2px}
.brow .pls img{width:16px;height:16px;border-radius:50%}
.howto{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:center;font-size:12px;padding:6px 0;border-top:1px solid var(--line)}
.hrow>img{width:32px;height:32px;border-radius:50%}
.flow{display:flex;align-items:center;flex-wrap:wrap;gap:3px}
.flow img{width:22px;height:22px}
.flow .ar{font-size:11px;margin:0 2px}
.fin{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.fin>img{width:28px;height:28px}
/* finder */
.sysrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.sysrow .types-s{display:flex;gap:4px;grid-column:1/-1}
.sysrow .types-s img{width:20px;height:20px;border-radius:50%;opacity:.25;filter:grayscale(1)}
.sysrow .types-s img.hit{opacity:1;filter:none}
.sysrow .sky{grid-column:1/-1;font-size:11px;color:var(--text-dim)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.chk input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.seckey{display:flex;gap:10px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
.seckey span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:1px}
.seckey .h::before{background:var(--hs)}.seckey .l::before{background:var(--ls)}.seckey .n::before{background:var(--ns)}
.finderhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:6px}
/* add-a-planet */
.addp .ah{display:flex;gap:12px;align-items:center}
.addp .ah>img{width:44px;height:44px;border-radius:50%;outline:2px solid var(--new);outline-offset:1px}
.addp .ah b{font-size:14px}
.addp .unl{color:var(--new);font-weight:600}
.slot{margin-top:10px;font-size:12px;color:var(--text-dim);line-height:1.5;padding-top:8px;border-top:1px solid var(--line)}
.slot b{color:var(--text)}
.slot.full b:first-child{color:var(--warning)}
.recipe{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:6px 8px;border:1px solid var(--line);border-radius:2px;background:transparent;font-size:12px;cursor:pointer;text-align:left}
.recipe:hover{border-color:var(--line-bright);background:var(--panel-2)}
.recipe::after{content:"›";margin-left:auto;color:var(--text-dim);font-size:16px}
.recipe img{width:28px;height:28px}
.qw-note{font-size:12px;color:var(--text-dim);margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
/* ---- drawer (shared by details + help) ---- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100vw;z-index:40;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .18s ease,visibility 0s .18s;box-shadow:-12px 0 32px rgba(0,0,0,.5)}
.drawer.open{transform:none;visibility:visible;transition:transform .18s ease}
.drawer>.ph{flex:none}
.drawer .db{flex:1;overflow:auto;padding:0 12px 16px}
.drawer .card{border:0;background:transparent;padding:0 0 14px;border-radius:0}
.drawer .card>h3:first-child{margin:0 -12px 10px;background:transparent;border-bottom:1px solid var(--line);border-top:1px solid var(--line);min-height:32px}
.drawer .card:first-child>h3:first-child{border-top:0}
.ibtn-g{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);border-radius:2px;cursor:pointer;font-size:14px}
.ibtn-g:hover{border-color:var(--line-bright);color:var(--text)}
.help ol{margin:0;padding-left:18px;font-size:12px;line-height:1.55;color:var(--text-dim)}
.help ol li{padding:4px 0}
.help ol b{color:var(--text)}
.lg{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;font-size:12px;color:var(--text-dim)}
.lg .k{display:flex;justify-content:center;font-weight:700}
.sw{display:inline-block;width:28px;height:14px;border:1px solid;border-radius:2px}
.hint{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-dim)}
.hint .x{margin-left:auto}
.picks{display:flex;align-items:center;gap:4px 14px;flex-wrap:wrap;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px}
.picks .lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}

new ResizeObserver(measureDock).observe(layoutEl);
const HINT_KEY = 'piMap.hintDismissed';
function openDrawer(kind, trigger) { if (kind === 'panel' && docked) return; if (!S.drawer) lastFocus = trigger || document.activeElement; S.drawer = kind; }
function closeDrawer() { S.drawer = null; render(); const f = lastFocus; lastFocus = null; if (f && document.contains(f)) f.focus(); }
function picksHTML() {
  if (docked || isPhone()) return '';
  if (S.q === 'have' && TOP.length) return `<div class="picks"><span class="lbl">Your picks</span>${TOP.map((t, i) => `<button class="pickbtn ${S.drawer === 'panel' && i === S.pick ? 'on' : ''}" data-pick="${i}" data-open><span class="rk">#${i + 1}</span>${iconImg(t.id)}${B[t.id].name}<span class="gn">${sg(t.gain)}/day</span></button>`).join('')}<span class="dim" style="font-size:11px">vs today · same as the Plan tab</span></div>`;
  if (S.q === 'best' && !S.sel) return `<div class="picks"><span class="lbl">Best one-planet recipes</span>${ranked().slice(0, 3).map(id => `<button class="pickbtn" data-sel="${id}">${iconImg(id)}${B[id].name}<span class="gn">${fm(value(id))}/day</span></button>`).join('')}</div>`;
  return '';
}
function legend() {
  if (S.q === 'have') return `<span><i style="background:var(--gold)"></i>#1–#3 Plan tab picks</span><span><i style="background:var(--path)"></i>Path of the pick</span><span><i style="background:var(--panel-2);outline:1px solid var(--line)"></i>Empty: can't make it</span><span><i style="background:var(--new)"></i>What-if unlock</span>`;
  return `<span><b style="color:var(--text)">820k</b> ISK/day per planet</span><span><span class="cmp better">Better</span> / <span class="cmp">≈</span> / <span class="cmp worse">Worse</span> than the simplest product there</span><span><i style="background:var(--line-bright);opacity:.5"></i>Faded: needs a planet you don't have</span>`;
}
function render() {
  renderCtx();
  TOP = computeTop(); if (S.pick >= TOP.length) S.pick = 0;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.q === S.q));
  document.getElementById('q1sub').textContent = S.q === 'have' ? (cols().length ? 'Same picks as the Plan tab, lit on the map.' : 'You have no colonies yet.') : 'Every product, ISK/day per planet.';
  document.getElementById('specific').innerHTML = S.q === 'have' ? 'Specific product in mind? <a class="ilink" data-gobest>Click it on the map</a>' : '';
  const v = view();
  if (isPhone()) {
    document.getElementById('phone').innerHTML = phoneHTML(v);
    if (fullOpen) { const w = document.getElementById('mapwrapPhone'); w.innerHTML = mapHTML(); paintMap(w, v); }
  } else {
    const wi = whatifHTML(), wel = document.getElementById('whatifDesk'); wel.className = 'whatif' + (wi.on ? ' on' : ''); wel.innerHTML = wi.h;
    document.getElementById('side').innerHTML = docked ? panelHTML() : '';
    let hd = false; try { hd = localStorage.getItem(HINT_KEY) === '1'; } catch (e) {}
    document.getElementById('hint').innerHTML = hd ? '' : `<div class="hint">Click a planet type to filter, or a product to trace it.<button class="textact x" data-dismisshint aria-label="Dismiss hint">Got it</button></div>`;
    document.getElementById('picks').innerHTML = picksHTML();
    paintMap(deskWrap, v);
  }
  const dr = document.getElementById('drawer'), was = dr.classList.contains('open'), open = !!S.drawer;
  dr.classList.toggle('open', open); dr.setAttribute('aria-hidden', String(!open));
  if (open) {
    document.getElementById('drawer-t').textContent = S.drawer === 'help' ? 'How to use the map' : S.q === 'have' && !whatifType() ? 'Best use of your planets' : S.sel ? B[S.sel].name : whatifType() ? 'Where to put a new colony' : 'Details';
    document.getElementById('drawerBody').innerHTML = S.drawer === 'help' ? HELP() : panelHTML();
    if (!was) dr.querySelector('[data-close]').focus();
  } else document.getElementById('drawerBody').innerHTML = '';
}
function paintOnly() {
  const v = view();
  if (isPhone()) { const w = document.getElementById('mapwrapPhone'); if (w && fullOpen) paintMap(w, v); return; }
  const wi = whatifHTML(), wel = document.getElementById('whatifDesk'); wel.className = 'whatif' + (wi.on ? ' on' : ''); wel.innerHTML = wi.h;
  paintMap(deskWrap, v);
}
function setPilot(k, keepMarket) {
  const p = PILOTS[k];
  Object.assign(S, { pilot: k, hsOnly: p.hsOnly, q: p.cols.length ? 'have' : 'best', sel: null, pick: 0, hover: null });
  if (!keepMarket) S.market = p.market;
  S.have = new Set(p.cols.length ? have() : ALL);
  MEMO.clear(); lsSet('piMock.pilot', MOCK_KEY[k]);
  render();
}

// ---------- events ----------
const tip = document.getElementById('tip'), pop = document.getElementById('pop');
document.addEventListener('change', e => {
  if (e.target.id === 'market') { S.market = e.target.value; lsSet('piMock.market', S.market); MEMO.clear(); render(); }
  if (e.target.id === 'bb') { S.buyback = +e.target.value; MEMO.clear(); render(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-q],[data-pick],.it,[data-planet],[data-sel],[data-clearsel],[data-fullmap],.ibtn,[data-gobest],[data-pilot],[data-hs],[data-clearwhatif],#gloss-btn,[data-help],[data-close],[data-open],[data-dismisshint]');
  if (!e.target.closest('.ibtn,#gloss-btn')) pop.style.display = 'none';
  if (!t) return;
  if (t.matches('.ibtn,#gloss-btn')) { e.stopPropagation(); const r = t.getBoundingClientRect();
    pop.innerHTML = t.id === 'gloss-btn' ? '<b>Planetary Industry</b> means a small base on a planet: <b>extractors</b> pull raw resources, <b>factories</b> turn them into products, a <b>launchpad</b> sends them to the customs office, and you sell them. Set it up once; it runs while you\'re offline.<br><br>The full 60-second explainer is on the <a href="plan.html" style="color:var(--accent)">Plan tab</a>. <a href="https://wiki.eveuniversity.org/Planetary_Industry" target="_blank" rel="noopener" style="color:var(--accent)">EVE University guide ↗</a>' : decodeURIComponent(t.dataset.info);
    pop.style.display = 'block'; pop.style.left = Math.max(8, Math.min(r.left, innerWidth - 316)) + 'px'; pop.style.top = (r.bottom + 6) + 'px'; return; }
  if (t.dataset.pilot) { S.drawer = null; setPilot(t.dataset.pilot); return; }
  if ('close' in t.dataset) { closeDrawer(); return; }
  if ('help' in t.dataset) { if (S.drawer === 'help') { closeDrawer(); return; } openDrawer('help', t); render(); return; }
  if ('dismisshint' in t.dataset) { try { localStorage.setItem(HINT_KEY, '1'); } catch (err) {} render(); return; }
  if ('open' in t.dataset && !t.dataset.pick) { openDrawer('panel', t); render(); return; }
  if (t.dataset.q) { S.q = t.dataset.q; S.sel = null; }
  else if (t.dataset.pick) { S.pick = +t.dataset.pick; S.q = 'have'; if ('open' in t.dataset) openDrawer('panel', t); }
  else if (t.matches('.it')) { if (t.classList.contains('ghost')) return; const id = +t.dataset.id; const rk = TOP.findIndex(r => r.id === id); if (S.q === 'have' && rk >= 0) { S.pick = rk; openDrawer('panel', t); } else if (B[id].tier >= 1) { S.q = 'best'; S.sel = S.sel === id && S.drawer ? null : id; if (S.sel) openDrawer('panel', t); else S.drawer = null; } }
  else if (t.dataset.planet) { const p = t.dataset.planet; if (S.have.has(p)) S.have.delete(p); else { S.have.add(p); if (MY().length && !MY().includes(p)) openDrawer('panel', t); } S.hover = null; }
  else if (t.dataset.sel) { S.q = 'best'; S.sel = +t.dataset.sel; openDrawer('panel', t); }
  else if ('clearsel' in t.dataset) { S.sel = null; if (S.drawer === 'panel') { closeDrawer(); return; } }
  else if ('clearwhatif' in t.dataset) { extras().forEach(x => S.have.delete(x)); S.hover = null; if (S.drawer === 'panel' && !S.sel && S.q !== 'have') { closeDrawer(); return; } }
  else if ('hs' in t.dataset) S.hsOnly = !S.hsOnly;
  else if (t.dataset.q) {}
  else if ('fullmap' in t.dataset) fullOpen = !fullOpen;
  else if ('gobest' in t.dataset) { S.q = 'best'; S.sel = null; }
  tip.style.display = 'none';
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.drawer) { e.preventDefault(); closeDrawer(); } });
document.addEventListener('mouseover', e => {
  const pl = e.target.closest('.pl'); const t = pl ? pl.dataset.planet : null;
  if (t !== S.hover) { S.hover = t; paintOnly(); }
});
document.addEventListener('mousemove', e => {
  const el = e.target.closest('.it:not(.ghost),[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  const id = +(el.dataset.id || el.dataset.tip), it = B[id]; if (!it) return;
  const inputs = it.inputs ? 'Made from: ' + it.inputs.map(x => x.q + '× ' + B[x.id].name).join(', ') : 'Found on: ' + it.planets.map(cap).join(', ');
  tip.innerHTML = `<div class="tt"><img src="${ic(id)}" alt="">${it.name}</div><div class="dim">${inputs}</div><div style="margin-top:4px">Sells for ≈ ${fm(price(id))} ISK at ${marketLabel()}</div>${it.tier ? `<div class="pos">≈ ${fm(value(id))} ISK/day per planet</div><div style="margin-top:4px">${cmpChip(id)}</div>` : '<div class="dim">Raw resources: huge volume, thin market; we never recommend selling them.</div>'}`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + 'px'; tip.style.top = Math.min(e.clientY + 14, innerHeight - 140) + 'px';
});
let rz, wasPhone = isPhone(); addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (isPhone() !== wasPhone) { wasPhone = isPhone(); render(); } measureDock(); }, 80); });
addEventListener('storage', e => { if (e.key === 'piMock.pilot') { const k = Object.keys(MOCK_KEY).find(x => MOCK_KEY[x] === e.newValue); if (k && k !== S.pilot) setPilot(k, true); } if (e.key === 'piMock.market' && e.newValue in MARKETS) { S.market = e.newValue; MEMO.clear(); render(); } });
// init: ?pilot= overrides; else shared localStorage (written by every PI tab)
const qp = new URLSearchParams(location.search).get('pilot');
const stored = Object.keys(MOCK_KEY).find(k => MOCK_KEY[k] === lsGet('piMock.pilot'));
setPilot(PILOTS[qp] ? qp : (stored || 'six'));
const sm = lsGet('piMock.market'); if (!qp && sm && sm in MARKETS && sm !== S.market) { S.market = sm; MEMO.clear(); render(); }
})();
</script>
