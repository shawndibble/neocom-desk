<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planetary Industry · Plan</title>
<style>
/* ---------- Neocom Desk tokens + primitives (docs/DESIGN.md, DESIGN-RULES.md) ---------- */
:root{--bg:#0a0e14;--panel:#11161d;--panel-2:#161d27;--line:#2a3442;--line-bright:#586c86;--text:#dee7ee;--text-dim:#95a3b4;--text-faint:#5c6b7a;--accent:#57c7f4;--accent-dim:#2e7da3;--accent-contrast:#04181f;--success:#5fd584;--warning:#f5b94a;--danger:#ff7369;--isk-pos:#4fd98a;--isk-neg:#ff8177;color-scheme:dark;--hs:#5fd584;--ls:#f5b94a;--ns:#ff7369;--panel-a:rgba(17,22,29,.85)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 'Segoe UI',Roboto,'Helvetica Neue',Arial,system-ui,sans-serif}
img{display:block}
a{color:var(--accent);font-weight:500}
.hide{display:none!important}
.num,.tab{font-variant-numeric:tabular-nums}
.pos{color:var(--isk-pos)}.neg{color:var(--isk-neg)}.dim{color:var(--text-dim)}.ok{color:var(--success)}.warn{color:var(--warning)}.bad{color:var(--danger)}
.micro{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.cap{font-size:11px;color:var(--text-dim)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px;padding-bottom:48px}
/* Panel */
.panel{border:1px solid var(--line);background:var(--panel-a);backdrop-filter:blur(4px);border-radius:2px}
.ph{min-height:36px;padding:4px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ph h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.ph .meta{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-right:auto;margin-left:4px}
.ph .acts{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pb{padding:12px}
.pb.flush{padding:0}
.pf{padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--text-dim)}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--text);font-family:inherit;font-weight:600;font-size:12px;line-height:1;letter-spacing:.1em;text-transform:uppercase;height:36px;padding:0 16px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line-bright);background:var(--panel-2)}
.btn.sm{height:28px;padding:0 10px;font-size:11px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,transparent)}
.btn.accent{border-color:var(--accent);color:var(--accent)}
.btn.accent:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);border-radius:2px;cursor:pointer;padding:0}
.ibtn:hover{border-color:var(--line-bright);color:var(--text)}
.ibtn svg{width:18px;height:18px}
.ibtn.sm{width:28px;height:28px}.ibtn.sm svg{width:16px;height:16px}
.textact{background:none;border:0;padding:0;font-family:inherit;font-weight:600;font-size:11px;line-height:1.4;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);cursor:pointer}
.textact:hover{text-decoration:underline}
/* FilterChip */
.fchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);border-radius:2px;font-family:inherit;font-weight:600;font-size:11px;line-height:1;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.fchip:hover{border-color:var(--line-bright);color:var(--text)}
.fchip.on{border-color:var(--accent-dim);background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.fchip.wi.on{border-color:color-mix(in srgb,var(--warning) 60%,transparent);background:color-mix(in srgb,var(--warning) 15%,transparent);color:var(--warning)}
.fchip img{width:18px;height:18px;border-radius:50%}
.fchip .n{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
.fchip.off img{filter:grayscale(1);opacity:.5}
/* SegmentedControl */
.segc{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.segc button{height:28px;padding:0 12px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--text-dim);font-family:inherit;font-weight:600;font-size:11px;line-height:1;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.segc button:first-child{border-left:0}
.segc button:hover{color:var(--text)}
.segc button.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
/* Select / input */
.sel,.inp{height:28px;padding:0 8px;border:1px solid var(--line-bright);background:var(--panel-2);color:var(--text);border-radius:2px;font-family:inherit;font-size:12px}
.inp.md{height:36px;padding:0 12px;font-size:14px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:none;cursor:pointer}
/* StatChips */
.stats{display:flex;flex-wrap:wrap;align-items:center}
.stat{display:inline-flex;align-items:center;height:28px;gap:6px;font-size:11px;white-space:nowrap;padding-left:12px;margin-left:12px;position:relative}
.stat::before{content:"";position:absolute;left:0;top:7px;width:1px;height:14px;background:var(--line)}
.stat:first-child{padding-left:0;margin-left:0}.stat:first-child::before{display:none}
.stat .l{font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim)}
.stat .v{font-weight:500;font-variant-numeric:tabular-nums}
/* tags */
.vtag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid transparent;border-radius:2px;font-family:inherit;font-weight:600;font-size:11px;line-height:1;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;flex:none}
.vtag.add{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.vtag.rm{border-color:color-mix(in srgb,var(--warning) 45%,transparent);background:color-mix(in srgb,var(--warning) 10%,transparent);color:var(--warning)}
.vtag.rebuild{border-color:var(--line-bright);color:var(--text-dim)}
.vtag.asis{background:var(--panel-2);color:var(--text-dim)}
.vtag.tier{border-color:var(--line);background:var(--panel-2);color:var(--text-dim)}
.vtag.est{border-color:color-mix(in srgb,var(--warning) 60%,transparent);color:var(--warning)}
.vtag.new{border-color:color-mix(in srgb,var(--warning) 60%,transparent);color:var(--warning)}
.qmark{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid var(--line);border-radius:50%;font-size:10px;color:var(--text-dim);cursor:help;flex:none}
.qmark:hover{border-color:var(--line-bright)}
.term{border-bottom:1px dotted var(--text-dim);cursor:help}
/* LoadMeter */
.meter{display:flex;align-items:center;gap:6px;font-size:11px}
.meter .l{font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap}
.meter .t{flex:1;height:6px;border-radius:9999px;background:var(--panel-2);overflow:hidden}
.meter .t i{display:block;height:100%;background:var(--accent)}
.meter .t i.tight{background:var(--warning)}
.meter .p{min-width:28px;text-align:right;color:var(--text-dim);font-variant-numeric:tabular-nums}
/* banner (panel without header) */
.banner{border:1px solid var(--line);background:var(--panel-a);border-radius:2px;padding:10px 12px;font-size:12px;color:var(--text)}
.banner b{font-weight:600}

/* ---------- mock bar + context ---------- */
.mock{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
.ctx{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctx label{display:inline-flex;align-items:center;gap:6px}
/* question picker */
.qpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.qopt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;padding:12px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--text);font-family:inherit;cursor:pointer}
.qopt:first-child{border-left:0}
.qopt:hover{background:var(--panel-2)}
.qopt.on{background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:inset 0 -2px 0 var(--accent)}
.qopt .art{display:flex;align-items:center;gap:2px;grid-row:1/3}
.qopt .art img{width:28px;height:28px}
.qopt .art img.pl{width:32px;height:32px;border-radius:50%}
.qopt .art .orb{margin-left:-8px}.qopt .art .orb:first-child{margin-left:0}
.qopt b{font-size:14px;font-weight:600}
.qopt.on b{color:var(--accent)}
.qopt span.c{font-size:12px;color:var(--text-dim);grid-column:2}
.qopt .chev{grid-row:1/3;grid-column:3;color:var(--text-dim);font-size:18px}
.qopt.muted{opacity:.6}

/* ---------- Q1 ---------- */
.hero{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.hnum{display:flex;align-items:baseline;gap:8px}
.hnum .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.hnum .c{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);max-width:220px;line-height:1.3}
.hero-sub{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line)}
.pstrip.n2{grid-template-columns:repeat(6,minmax(0,1fr))}
.pcell{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--text);font-family:inherit;text-align:left;cursor:pointer;min-width:0}
.pcell:first-child{border-left:0}
.pcell:hover{background:var(--panel-2)}
.pcell img{width:40px;height:40px;border-radius:50%;flex:none}
.pcell .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.pcell b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcell .q{font-size:11px;color:var(--warning);font-variant-numeric:tabular-nums}
.pcell .r{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);font-variant-numeric:tabular-nums}
.pcell .r .pos,.pcell .r .neg{letter-spacing:0}
/* rows */
.rows > .row{border-top:1px solid var(--line)}
.rows > .row:first-child{border-top:0}
.qwrow{display:grid;grid-template-columns:16px 36px 24px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 12px;cursor:pointer}
.qwrow:hover{background:var(--panel-2)}
.qwrow.done .tx{text-decoration:line-through;color:var(--text-dim)}
.pimg{position:relative;width:32px;height:32px}
.pimg > img{width:32px;height:32px;border-radius:50%}
.pimg .g{position:absolute;right:-5px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line-bright);display:grid;place-items:center;color:var(--text)}
.pimg .g svg{width:10px;height:10px}
.qwrow > img{width:24px;height:24px}
.qwrow .tx{font-size:13px}
.qwrow .gain{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.qwrow .tm{font-size:11px;color:var(--text-dim);white-space:nowrap;min-width:44px;text-align:right}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto 76px;gap:12px;align-items:center;padding:10px 12px}
.prow > img{width:40px;height:40px;border-radius:50%}
.say{font-size:14px}
.say b{font-weight:600}
.alt{margin-top:4px}
.alt summary{list-style:none;display:inline}
.alt summary::-webkit-details-marker{display:none}
.alt .body{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--text-dim)}
.alt .body img{width:20px;height:20px;flex:none}
.fig{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig img{width:24px;height:24px}
.fig .o{color:var(--text-dim)}
.fig .a{color:var(--text-dim)}
.fig b{font-weight:600;font-size:14px}
.prow .tagc{text-align:right}
.ships{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.nudge{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap}
.slots{display:flex;gap:4px}
.slots img{width:20px;height:20px;border-radius:50%}
.slots i{width:20px;height:20px;border-radius:50%;border:1px dashed var(--line-bright);display:block}
/* steps */
.stepcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.scol{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.scol:nth-child(3n+1){border-left:0}
.scol:nth-child(n+4){border-top:1px solid var(--line)}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.shead img{width:28px;height:28px;border-radius:50%}
.shead b{font-size:13px;font-weight:600;display:block}
.shead small{font-size:11px;color:var(--text-dim)}
.shead .m{margin-left:auto;font-size:11px;color:var(--text-dim);white-space:nowrap}
.srow{display:grid;grid-template-columns:16px auto 20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.srow:hover{background:var(--panel-2)}
.srow img,.srow svg{width:20px;height:20px}
.srow svg{color:var(--text-dim)}
.srow .m{font-size:11px;color:var(--text-dim);white-space:nowrap}
.srow.done .tx{text-decoration:line-through;color:var(--text-dim)}
.sfit{padding:8px 12px;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);margin-top:auto}

/* ---------- Q2 ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.guide{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text-dim);margin-top:10px}
.ctrls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctrls .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rrow{display:grid;grid-template-columns:24px minmax(180px,1.3fr) minmax(170px,1.2fr) minmax(150px,1fr) 110px minmax(150px,1fr) auto;gap:12px;align-items:center;padding:10px 12px;position:relative}
.rrow.newly{box-shadow:inset 2px 0 0 var(--warning)}
.rrow.open{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.rk{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.prod{display:flex;align-items:center;gap:10px;min-width:0}
.prod > img{width:32px;height:32px;flex:none}
.prod b{font-size:14px;font-weight:600;display:block}
.prod .s{display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.need{display:flex;flex-direction:column;gap:3px;font-size:12px}
.need .pt{display:flex;align-items:center;gap:6px}
.need .pt img{width:22px;height:22px;border-radius:50%}
.need .pt.lack img{filter:grayscale(.6) brightness(.8)}
.need .pt b{font-weight:600}
.need .pt .st{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.chain{display:flex;align-items:center;gap:3px}
.chain img{width:24px;height:24px}
.chain img.end{width:28px;height:28px}
.chain .a{color:var(--text-dim);font-size:12px;margin:0 2px}
.val .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.val .c{font-size:11px;color:var(--text-dim);display:block;white-space:nowrap}
.cmp{font-size:12px;line-height:1.3}
.cmp.better{color:var(--success)}.cmp.same{color:var(--text-dim)}.cmp.worse{color:var(--danger)}
.howrow{background:var(--panel-2);border-top:1px solid var(--line)}
.howhead{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.howhead img{width:24px;height:24px}
.howhead .micro{margin-right:auto}
.hcols{display:grid;grid-template-columns:1.15fr 1.2fr .9fr}
.hcol{padding:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.hcol:first-child{border-left:0}
.hcol p{margin:0;font-size:12px;color:var(--text-dim)}
.sysl > div{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.sysl .ty{display:flex;gap:3px;grid-column:1/-1}
.sysl .ty img{width:18px;height:18px;border-radius:50%;opacity:.3;filter:grayscale(1)}
.sysl .ty img.hit{opacity:1;filter:none}
.sysl .sky{grid-column:1/-1;font-size:11px;color:var(--danger)}
.secn{font-weight:600;font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.globe{position:relative;width:200px;height:200px;margin:4px auto}
.globe > img{width:100%;height:100%;border-radius:50%}
.globe svg.ln{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px}
.pin .ring{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(10,14,20,.88);border:1px solid var(--accent)}
.pin .ring img,.pin .ring svg{width:20px;height:20px}
.pin.lp .ring{border-color:var(--warning);color:var(--warning)}
.pin label{font-size:10px;background:rgba(10,14,20,.85);padding:0 4px;white-space:nowrap}
.pinl > div{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-top:1px solid var(--line)}
.pinl img,.pinl svg{width:20px;height:20px;flex:none;color:var(--text-dim)}
.runl > div{display:flex;gap:10px;align-items:center;font-size:12px;padding:6px 0;border-top:1px solid var(--line)}
.runl svg,.runl img{width:20px;height:20px;flex:none;color:var(--text-dim)}
/* all products */
.tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tcol{border-left:1px solid var(--line);min-width:0}
.tcol:first-child{border-left:0}
.tcol .th{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ptl{display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.ptl img{width:24px;height:24px;grid-row:1/4}
.ptl b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptl .pr{font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.ptl .pr b{color:var(--text);font-size:11px;font-weight:600}
.ptl .cmp{font-size:11px}
.ptl.ghost{opacity:.35}
.ptl.newly{box-shadow:inset 2px 0 0 var(--warning)}
.ptl .rawn{font-size:11px;color:var(--warning)}
/* Q3 */
.q3{display:flex;gap:8px;flex-wrap:wrap}
.q3 .inp{flex:1;min-width:220px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);transition:transform .2s;overflow:auto}
body.gl .scrim{display:block}body.gl .drawer{transform:none}
.drawer .pb p{margin:0 0 10px;font-size:13px;color:var(--text-dim)}
.drow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.drow img{width:32px;height:32px;flex:none}
.drow img.pl{border-radius:50%}
.drow svg{width:24px;height:24px;flex:none;color:var(--text-dim)}
.drow b{display:block;font-size:13px;font-weight:600}
.drow small{font-size:12px;color:var(--text-dim)}
.drow .vtag{margin-left:auto}
.darr{font-size:11px;color:var(--text-dim);padding:2px 0 2px 44px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}

/* ---------- phone ---------- */
@media (max-width:767px){
  .btn{height:44px}.btn.sm{height:36px}.ibtn{width:44px;height:44px}.ibtn.sm{width:36px;height:36px}

<script>
(function(){
const B = PI_BY_ID, N = PI_BY_NAME;
const CAP = 6000, TAX = 0.10;                 // raw units/hour one planet extracts; customs office rate
const ALL = ['barren','gas','ice','lava','oceanic','plasma','storm','temperate'];
const SHIPS = [['Frigate cargo',400],['Industrial hauler',5000],['Epithal (planetary bay)',45000]];

// ---------- sample pilots (mock switch) ----------
const C6 = SAMPLE_COLONIES;
const PILOTS = {
  six:{label:'6 colonies', home:'Efa', sec:0.4, cols:C6, market:'Amarr', hsOnly:false},
  two:{label:'2 colonies (highsec)', home:'Hek', sec:0.5, cols:C6.filter(c=>c.type==='barren'||c.type==='temperate').map(c=>({...c,cc:c.type==='barren'?1:4})), market:'Rens', hsOnly:true},
  none:{label:'No colonies', home:'Hek', sec:0.5, cols:[], market:'Jita', hsOnly:true},
  nul:{label:'No colonies (nullsec, corp buyback)', home:'Sample null system', sec:-0.3, cols:[], market:'Buyback', hsOnly:false},
};
// Sample: other hubs priced as Jita x factor; route = [jumps, lowsec jumps] from home
const MARKETS = {Jita:1, Amarr:.98, Dodixie:.96, Rens:.97, Hek:.95, Buyback:null};
const ROUTES = {Efa:{Jita:[15,4],Amarr:[9,3],Dodixie:[19,3],Rens:[13,3],Hek:[12,3],Buyback:[0,0]},
                'Sample null system':{Jita:[24,9],Amarr:[27,9],Dodixie:[29,9],Rens:[22,9],Hek:[21,9],Buyback:[0,0]},
                Hek:{Jita:[11,0],Amarr:[22,0],Dodixie:[14,0],Rens:[4,0],Hek:[0,0],Buyback:[0,0]}};
const SYSTEMS = {
  Efa:[['Efa (home)',0,0.4,['barren','gas','lava','storm','temperate']],['Sample system A',1,0.3,['barren','ice','oceanic','plasma']],['Sample system B',2,0.6,['gas','lava','plasma','storm','temperate']],['Sample system C',2,-0.2,['ice','oceanic','plasma','temperate']],['Sample system D',3,0.8,['barren','lava','oceanic','storm']],['Sample system E',3,-0.4,['gas','ice','lava','plasma']],['Sample system F',4,0.5,['ice','oceanic','gas','storm']]],
  'Sample null system':[['Home system',0,-0.3,['barren','gas','lava','plasma','temperate']],['Sample system A',1,-0.5,['ice','oceanic','storm','temperate']],['Sample system B',2,-0.2,['barren','gas','oceanic','plasma']],['Sample system C',3,-0.6,['lava','ice','storm','gas']],['Sample system D',4,0.2,['temperate','oceanic','barren']]],
  Hek:[['Hek (home)',0,0.5,['barren','gas','temperate','storm']],['Sample system A',1,0.7,['barren','lava','oceanic','temperate']],['Sample system B',1,0.6,['gas','ice','storm','oceanic']],['Sample system C',2,0.4,['plasma','lava','barren','ice']],['Sample system D',3,0.9,['oceanic','temperate','gas','lava']],['Sample system E',3,0.5,['ice','plasma','storm','barren']],['Sample system F',5,-0.3,['plasma','lava','ice','gas']]],
};

const S = { make:'any', rankNote:false, pilot:'six', q:1, pref:'isk', market:'Amarr', buyback:90, view:'guided', off:new Set(), whatif:new Set(), how:null, done:new Set(), hsOnly:false };
const P = () => PILOTS[S.pilot];
const cols = () => P().cols;
const have = () => [...new Set(cols().map(c=>c.type))];

// ---------- formatting ----------
const fm = v => { const a=Math.abs(v), s=v<0?'−':''; if(a>=1e6) return s+(a/1e6).toFixed(2)+'M'; if(a>=1e3) return s+Math.round(a/1e3)+'k'; return s+Math.round(a); };
const sg = v => (v>=0?'+':'')+fm(v);
const cap = s => s[0].toUpperCase()+s.slice(1);
const an = s => (/^[aeiou]/i.test(s)?'an ':'a ')+s;
const ic = (id, cls='') => `<img class="${cls}" src="${iconFor(id)}" alt="${B[id].name}" title="${B[id].name}">`;
const pl = (t, cls='') => `<img class="${cls}" src="${planetIcon(t)}" alt="${t} planet" title="${cap(t)} planet">`;
const secCls = s => s>=0.45?'hs':s>0?'ls':'ns';
const secCol = s => `var(--${secCls(s)})`;
const KIND = ['raw resource','processed product','refined product','specialized product','advanced product'];
const EX = {0:2309,1:2390,2:N['Coolant'].id,3:N['Robotics'].id}; // icon examples for jargon
const TERM = {
  0:'Raw resource: what an extractor pulls out of a planet (e.g. Ionic Solutions).',
  1:'Processed: a basic factory makes it from one raw resource (e.g. Electrolytes).',
  2:'Refined: an advanced factory makes it from two processed products (e.g. Coolant).',
  3:'Specialized: made from refined products; usually needs several planets.',
};
const tierWord = (t,noIc) => `<span class="term" data-term title="${TERM[Math.min(t,3)]}">${noIc?'':ic(EX[Math.min(t,3)])}${['raw','processed','refined','specialized','advanced'][t]}</span>`;

// ---------- THE number model: ISK/day per planet for this pilot, after customs, at their market ----------
const mf = () => S.market==='Buyback' ? S.buyback/100 : MARKETS[S.market];
const price = id => B[id].sell * mf();
const raws = id => [...PI.rawLeaves(id)];
const oneTypes = id => ALL.filter(t => raws(id).every(p => B[p].planets.includes(t)));
const rateOne = id => B[id].tier===0 ? CAP : CAP / PI.p0PerUnit(id);
const volDay = id => rateOne(id)*B[id].vol*24;
function coverPlanets(id){ // greedy: each planet extracts up to 2 of the raws it can yield
  let left = raws(id), n = 0;
  while(left.length){ let best=null, bc=[];
    for(const t of ALL){ const c=left.filter(p=>B[p].planets.includes(t)).slice(0,2); if(c.length>bc.length){bc=c;best=t;} }
    if(!best) return 99; left = left.filter(p=>!bc.includes(p)); n++; }
  return n;
}
const planetsNeeded = id => oneTypes(id).length ? 1 : coverPlanets(id) + (B[id].tier>=3 ? 1 : 0);
const MEMO = new Map();
function value(id){ // ISK/day per planet
  const key = id+'|'+mf(); if(MEMO.has(key)) return MEMO.get(key);
  const it = B[id]; let v;
  if(oneTypes(id).length){ v = rateOne(id)*24*(price(id) - PI.TAX_BASE[it.tier]*TAX); }
  else { const n = planetsNeeded(id), ext = n - (it.tier>=3?1:0);
    const e = PI.economics(id, CAP*ext/PI.p0PerUnit(id), 0, TAX).perDay; v = (e.revenue*mf() - e.tax)/n; }
  MEMO.set(key, v); return v;
}
const optionsOn = t => PI_ITEMS.filter(i => i.tier>=1 && i.tier<=2 && oneTypes(i.id).includes(t)).map(i=>i.id);
const bestProcessed = t => optionsOn(t).filter(id=>B[id].tier===1).sort((a,b)=>value(b)-value(a))[0];
function compare(id){ // vs the best processed product on the planet type you'd use
  const ts = oneTypes(id).length ? oneTypes(id) : [...new Set(raws(id).flatMap(p=>B[p].planets))];
  const mine = ts.filter(t=>have().includes(t)); const use = mine.length?mine:ts;
  const t = use.sort((a,b)=>value(bestProcessed(a))-value(bestProcessed(b)))[0];
  const ref = bestProcessed(t), r = value(id)/value(ref);
  const mineT = have().includes(t);
  const word = r>1.05?'Better than':r>=0.95?'About the same as':'Worse than';
  const what = mineT ? `selling ${B[ref].name} from this planet` : `${B[ref].name}, the simplest product on ${an(cap(t))} planet`;
  const txt = id===ref ? (mineT?`Best simple product for your ${cap(t)} planet`:`The simplest product on ${an(cap(t))} planet`) : `${word} ${what}`;
  const sh = id===ref ? `Best simple product on ${cap(t)}` : `${word} ${B[ref].name}`;
  return {t, ref, cls: id===ref?'same':r>1.05?'better':r>=0.95?'same':'worse', txt, sh};
}
const cmpChip = (id,short) => { const c=compare(id); const t = short ? c.sh : c.txt; return `<span class="cmp ${c.cls}" title="Compared with ${B[c.ref].name} on ${an(cap(c.t))} planet: ${fm(value(c.ref))}/day">${t}</span>`; };
// pick per planet: Most ISK = highest value; Least hauling = highest value among one-planet factories (refined)
function pickFor(t, pref){ const o = optionsOn(t); const pool = pref==='haul' ? o.filter(id=>B[id].tier===2) : o; return pool.sort((a,b)=>value(b)-value(a))[0]; }
function planRows(pref){
  return cols().map(c=>{ const today=N[c.doing.split('→')[1].trim()].id; const pick=pickFor(c.type,pref);
    const other = pickFor(c.type, pref==='isk'?'haul':'isk');
    return {c, today, pick, same: pick===today, other}; });
}

// ---------- glyphs ----------
const G = {
  ext:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v13"/><path d="M8 11l4 4 4-4"/><circle cx="12" cy="19" r="3"/></svg>`,
  fac:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V10l6 4V10l6 4V5h6v16z"/></svg>`,
  lp:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c3 3 4 7 4 11H8c0-4 1-8 4-11z"/><path d="M8 13l-3 4h4M16 13l3 4h-4M10 20h4"/></svg>`,
  cc:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18a8 8 0 0116 0z"/><path d="M2 18h20M12 6V3"/></svg>`,
  poco:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg>`,
  sky:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8"/><path d="M6 8h12l-6-6z"/><path d="M8 22h8"/></svg>`,
  ship:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13h13l5-4v8l-5-2H3z"/><path d="M6 13V9h6v4"/></svg>`,
  clock:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  box:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>`,
  wrench:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 6a4 4 0 015 5l-9 9-3-3 9-9"/></svg>`,
};

// ---------- header bits ----------
function route(){ return ROUTES[P().home][S.market]; }
function marketLabel(){ return S.market==='Buyback' ? `corp buyback (${S.buyback}% of Jita)` : S.market; }
function routeText(){ const [j,l]=route(); if(S.market==='Buyback') return 'Corp buyback: drop off in your home system'; return `${j} jumps to ${S.market}${l?` · <span style="color:${P().sec<=0?'var(--ns)':'var(--ls)'}">${l} ${P().sec<=0?'lowsec/nullsec':'lowsec'} jumps</span>`:' · all highsec'}`; }
const QWDATA = {
  six:[
    {p:'Hek VIII',k:'reset',icon:2305,txt:"Restart Hek VIII's Autotrophs extractor: it stops in 6 h and has slowed to 60% of its first day.",gain:95000,m:1},
    {p:'Lustrevik III',k:'store',icon:2395,txt:"Lustrevik III's launchpad is full in 16 h, before your next haul. Haul now or add a storage unit.",save:120000,m:2},
    {p:'Uttindar V',k:'idle',icon:2392,txt:'Uttindar V has 2 Basic factories with no input. Remove them, or set them to Oxidizing Compound to use the spare raw.',gain:40000,m:1},
    {p:'Hek VI',k:'room',icon:2267,txt:'Hek VI has room for 2 more extractor heads.',gain:55000,m:2},
  ],
  two:[
    {p:'Hek VIII',k:'reset',icon:2305,txt:"Restart Hek VIII's Autotrophs extractor: it stops in 6 h and has slowed to 60% of its first day.",gain:95000,m:1},
    {p:'Hek VI',k:'store',icon:2398,txt:"Hek VI's launchpad is full in 20 h, before your next haul. Haul now or add a storage unit.",save:80000,m:2},
  ],
};
const quickWins = () => (QWDATA[S.pilot]||[]).filter(q=>cols().some(c=>c.name===q.p)).slice().sort((a,b)=>((b.gain||b.save)/b.m)-((a.gain||a.save)/a.m));
const qwOn = name => quickWins().filter(q=>q.p===name&&q.gain).reduce((s,q)=>s+q.gain,0);
const QWG = {reset:G.ext, idle:G.fac, store:G.box, room:G.ext};
const QWV = {reset:'Restart', idle:'Fix', store:'Haul', room:'Add'};
const MIN = {rm:1, ext:4, set:1, fac:2, route:2};
function stepsFor(r){
  const c=r.c, k=c.name, old0=raws(r.today)[0], it=B[r.pick], need=raws(r.pick), items=[];
  const push=(key,op,cls,icon,txt,m)=>items.push({key:k+key,op,cls,icon,txt,m});
  if(!need.includes(old0)) push('rm','Remove','rm',ic(old0),`${B[old0].name} extractor`,MIN.rm);
  need.filter(p=>p!==old0).forEach(p=>push('x'+p,'Place','add',ic(p),`${B[p].name} extractor (scan for a bright spot)`,MIN.ext));
  if(it.tier===0) push('f','Remove','rm',ic(r.today),`Basic factories (you sell the raw resource as-is)`,MIN.rm);
  if(it.tier===1) push('f','Set','set',ic(r.pick),`Basic factories → ${it.name}`,MIN.set);

  <div class="hcols">
    <div class="hcol"><div class="micro">1 · Find ${an(ts.map(cap).join(' or '))} planet</div>
      ${mine.length?`<p><span class="ok">✓ You already have one:</span> ${mine.map(c=>c.name).join(', ')}. Rebuild it, or start a new colony nearby.</p>`:`<p>You don't have one yet. Nearby systems that do:</p>`}
      <label class="chk" data-hs><input type="checkbox" ${S.hsOnly?'checked':''} tabindex="-1">Highsec only</label>
      <div class="sysl">${sys.map(s=>`<div><span><b>${s[0]}</b> <span class="dim">· ${s[1]===0?'here':s[1]+' jump'+(s[1]>1?'s':'')}</span></span><span class="secn" style="color:${secCol(s[2])}">${s[2].toFixed(1)}</span><span class="cap">${secCls(s[2])==='hs'?'highsec':secCls(s[2])==='ls'?'lowsec':'nullsec'}</span><span class="ty">${ALL.filter(x=>s[3].includes(x)).map(x=>`<img src="${planetIcon(x)}" class="${ts.includes(x)?'hit':''}" title="${x}">`).join('')}</span>${s[2]<=0?'<span class="sky">Nullsec: planets may have a Skyhook next to the customs office. You still export through the customs office.</span>':''}</div>`).join('') || '<p>None within 5 jumps in highsec. Untick “Highsec only”.</p>'}</div>
      <span class="cap">Systems are illustrative sample data.</span></div>
    <div class="hcol"><div class="micro">2 · Build these</div>
      <div class="globe">${pl(t)}<svg class="ln" viewBox="0 0 100 100" preserveAspectRatio="none"><g stroke="#57c7f4" stroke-width=".5" stroke-dasharray="1.5 1" fill="none">${pins.slice(1).map(p=>`<line x1="58" y1="50" x2="${p[1]}" y2="${p[2]}"/>`).join('')}</g></svg>
        ${pins.map(p=>`<div class="pin ${p[0]}" style="left:${p[1]}%;top:${p[2]}%"><div class="ring">${p[3]}</div><label>${p[4]}</label></div>`).join('')}</div>
      <div class="pinl"><div>${G.cc}Command Center</div><div>${G.lp}1 launchpad</div>${p0.map(p=>`<div>${ic(p)}Extractor: ${B[p].name}</div>`).join('')}
        ${it.tier===2?it.inputs.map(x=>`<div>${ic(x.id)}Basic factory: ${B[x.id].name}</div>`).join('')+`<div>${ic(id)}Advanced factory: ${it.name}</div>`:`<div>${ic(id)}2 basic factories: ${it.name}</div>`}</div>
      <div class="sfit" style="padding:0">${fitMeter(fit,mine[0]?mine[0].cc:null)}</div></div>
    <div class="hcol"><div class="micro">3 · Run it</div>
      <div class="runl"><div>${G.clock}<span>Restart the extractors every day (~5 min).</span></div>
        <div>${G.box}<span>Collect ~${Math.round(rateOne(id)*24).toLocaleString()} ${it.name} a day (${Math.round(volDay(id)).toLocaleString()} m³) from the launchpad.</span></div>
        <div>${G.ship}<span>${S.market==='Buyback'?routeText():`Sell at ${marketLabel()}: ${routeText()}`}.</span></div>
        <div>${ic(id)}<span>Earns about <span class="pos">${fm(value(id))} ISK/day</span>.</span></div></div>${estTag()}</div>
  </div>`;
}
function renderAll(){
  const o=owned(), wi=[...S.whatif];
  const can = (id,types) => PI.reachable(id,types).ok;
  const names=['Raw','Processed','Refined','Specialized','Advanced'];
  return panel('All products', `<div class="tiers">${[0,1,2,3,4].map(t=>{
    const items=PI_ITEMS.filter(i=>i.tier===t).sort((a,b)=>value(b.id)-value(a.id));
    const okN=items.filter(i=>can(i.id,o)).length;
    return `<div class="tcol"><div class="th">${tierTag(t)}<span class="micro">${names[t]}</span><span class="cap" style="margin-left:auto">${okN}/${items.length} you can make</span></div><div class="list">${items.map(i=>{
      const ok=can(i.id,o), nw=!ok && wi.length && can(i.id,[...o,...wi]); const np=planetsNeeded(i.id), c=t?compare(i.id):null;
      return `<div class="ptl ${ok?'':nw?'newly':'ghost'}" title="${i.name}: ${fm(value(i.id))} ISK/day per planet${np>1?`, needs ${np} planets`:''}">${ic(i.id)}<b>${i.name}</b><span class="pr"><b>${fm(value(i.id))}</b>/day · ${np>1?`needs ${np} planets`:'1 planet'}${nw?' · <span class="warn">new</span>':''}</span>${t===0?'<span class="rawn" title="Raw resources are ~16× the hauling of a one-planet factory and have thin markets; we never recommend selling them.">Raw: huge volume, thin market</span>':`<span class="cmp ${c.cls}">${c.sh}</span>`}</div>`;}).join('')}</div></div>`;}).join('')}</div>`,
    {flush:true, meta:`ISK/day per planet · ${marketLabel()}`, foot:'Each line names what it compares with: the simplest (processed) product on the same planet type. Faded = needs a planet type you don’t have.'});
}

// ---------- Q3 ----------
function renderQ3(){
  const pop=['Coolant','Mechanical Parts','Robotics','Nanites','Construction Blocks'].map(n=>N[n]);
  return panel('Make a specific product', `<div class="q3"><input class="inp md" id="q3in" list="q3list" placeholder="Search any PI product, e.g. Robotics"><datalist id="q3list">${PI_ITEMS.filter(x=>x.tier>0).map(x=>`<option value="${x.name}">`).join('')}</datalist><button class="btn primary" id="q3go">Open the planner</button></div>
    <div class="chips" style="margin-top:12px"><span class="micro">Popular</span>${pop.map(i=>`<button class="fchip" data-pop="${i.name}"><img src="${iconFor(i.id)}" style="border-radius:0">${i.name}</button>`).join('')}</div>
    <p class="cap" id="q3stub" style="font-size:12px;margin:12px 0 0">The planner opens here: pick a product and a rate, and it lays out every planet, factory and haul.</p>`);
}

// ---------- explainer ----------
function renderDrawer(){
  const ex=[['gas','planet','A planet','Each planet type holds different raw resources.'],[2309,0,'Raw resource','Ionic Solutions, pulled out of a Gas planet by an extractor.'],[2390,1,'Processed','A basic factory turns 3,000 Ionic Solutions into 20 Electrolytes.'],[N['Coolant'].id,2,'Refined','An advanced factory combines Electrolytes + Water into Coolant.']];
  document.getElementById('drawer').innerHTML=`<div class="ph"><h2>New to PI? The 60-second explainer</h2><div class="acts"><button class="ibtn sm" id="gloss-x" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>
    <div class="pb"><p>Planetary Industry (PI) means building a small base on a planet that mines resources and turns them into products you sell. Set it up once; it keeps running while you're offline.</p>
    ${ex.map((e,i)=>`${i?`<div class="darr">↓ ${i===1?'extractor':'factory'}</div>`:''}<div class="drow">${e[1]==='planet'?pl(e[0],'pl'):ic(e[0])}<div><b>${e[2]}</b><small>${e[3]}</small></div>${e[1]==='planet'?'':`<span class="vtag tier" title="Other tools call this P${e[1]}">P${e[1]}</span>`}</div>`).join('')}
    <div class="darr">↓ launchpad → customs office → market</div>
    <div class="micro" style="margin:14px 0 4px">The buildings</div>
    <div class="drow">${G.cc}<div><b>Command Center</b><small>Your base. Its upgrade level (0–5) gives more room for buildings. Level 4 fits every setup on this page.</small></div></div>
    <div class="drow">${G.ext}<div><b>Extractor</b><small>Drills one raw resource. It runs for a time you choose, then you reset it (every few days).</small></div></div>
    <div class="drow">${G.fac}<div><b>Factory</b><small>Basic factories make processed products from raw. Advanced factories combine two products.</small></div></div>
    <div class="drow">${G.lp}<div><b>Launchpad</b><small>Storage that sends products up to the customs office.</small></div></div>
    <div class="drow">${G.poco}<div><b>Customs office</b><small>The station in orbit where you pick up your products. Its owner keeps a tax (here 10%).</small></div></div>
    <div class="drow">${G.sky}<div><b>Skyhook (nullsec only)</b><small>A sovereignty structure some nullsec planets have next to the customs office. It isn't part of your colony; ignore it for PI.</small></div></div>
    <p style="margin-top:12px">A <b>one-planet setup</b> does everything on one planet: extractors → basic factories → (advanced factory). No hauling between planets.</p>
    <p>Learn more: <a href="https://wiki.eveuniversity.org/Planetary_Industry" target="_blank" rel="noopener">EVE University: Planetary Industry</a></p></div>`;
}

// ---------- render & events ----------
function render(){
  renderCtx(); renderQPick();
  document.getElementById('answer').innerHTML = S.q===1?renderQ1():S.q===2?renderQ2():renderQ3();
}

const MOCK_KEY = {six:'6', two:'2', none:'none', nul:'null'};
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
function setPilot(k){ const p=PILOTS[k]; Object.assign(S,{pilot:k, market:p.market, hsOnly:p.hsOnly, q:p.cols.length?1:2, off:new Set(), whatif:new Set(), how:null, rankNote:false, make:'any'}); MEMO.clear(); lsSet('piMock.pilot', MOCK_KEY[k]); render(); }
document.addEventListener('change',e=>{
  if(e.target.id==='market'||e.target.id==='bb'){ const before=ranked().slice(0,3).join(); if(e.target.id==='market'){ S.market=e.target.value; lsSet('piMock.market', S.market); } else S.buyback=+e.target.value; MEMO.clear(); S.rankNote = S.q===2 && ranked().slice(0,3).join()!==before; render(); }
});
document.addEventListener('click',e=>{
  const lab=e.target.closest('label[data-step],label[data-hs]');
  if(lab){ if(e.target.tagName!=='INPUT') return; // label click re-dispatches to the input; handle once
    if(lab.dataset.step!==undefined){ const k=lab.dataset.step; S.done.has(k)?S.done.delete(k):S.done.add(k); lab.classList.toggle('done', S.done.has(k)); }
    else { S.hsOnly=!S.hsOnly; render(); const h=document.getElementById('howto'); }
    return; }
  const t=e.target.closest('[data-pilot],[data-pref],[data-view],[data-make],[data-gloss],[data-q],[data-jump],[data-type],[data-whatif],[data-how],[data-pop],#gloss-btn,#gloss-x,#scrim,#q3go');
  if(!t) return;
  const d=t.dataset;
  if(d.pilot){setPilot(d.pilot);return;}
  if(d.pref){S.pref=d.pref;S.how=null;render();return;}
  if(d.make){S.make=d.make;S.how=null;S.rankNote=false;render();return;}
  if(d.view){S.view=d.view;S.how=null;render();return;}
  if(d.gloss!==undefined||t.id==='gloss-btn'){e.preventDefault();document.body.classList.add('gl');return;}
  if(d.q){S.q=+d.q;S.how=null;render();return;}
  if(d.jump){const el=document.getElementById('plan-'+d.jump.toLowerCase().replace(/\s+/g,'-'));el&&el.scrollIntoView({block:'center'});return;}
  if(d.type){const k=d.type;S.off.has(k)?S.off.delete(k):S.off.add(k);S.how=null;render();return;}
  if(d.whatif){const k=d.whatif;S.whatif.has(k)?S.whatif.delete(k):S.whatif.add(k);S.how=null;render();return;}
  if(d.how!==undefined){const id=d.how?+d.how:null; S.how=(id&&S.how!==id)?id:null; render(); const h=document.getElementById(S.how?'rr-'+S.how:'x'); if(h) h.scrollIntoView({block:'start'}); return;}
  if(d.pop){document.getElementById('q3in').value=d.pop;}
  if(d.pop||t.id==='q3go'){const v=document.getElementById('q3in').value||'a product';document.getElementById('q3stub').innerHTML=`Opening the planner for <b>${v}</b>… (stub: hands off to the planner with the product filled in.)`;return;}
  document.body.classList.remove('gl');
});
renderDrawer();
const qp=new URLSearchParams(location.search).get('pilot');
const stored=Object.keys(MOCK_KEY).find(k=>MOCK_KEY[k]===lsGet('piMock.pilot'));
setPilot(PILOTS[qp]?qp:(stored||'six'));
if(location.hash.startsWith('#plan-')){ const el=document.getElementById(location.hash.slice(1)); if(el) setTimeout(()=>el.scrollIntoView({block:'center'}),0); }
const sm=lsGet('piMock.market'); if(!qp && sm && sm in MARKETS && sm!==S.market){ S.market=sm; MEMO.clear(); render(); }
})();
</script>
