<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Neocom Desk</title>
    <!-- Warm the connections the first screen needs before the JS that asks
         for them has parsed. ESI and the SSO token endpoint are CORS fetches,
         so their preconnects must be `crossorigin` to be reused. Image-server
         <img> requests are no-cors today (src/sw.ts routes only navigations,
         so they reach the network untouched), and browsers keep separate
         connection pools for the two modes — so images.evetech.net gets both:
         plain for today's <img>, `crossorigin` for any image loaded in CORS
         mode (an <img crossorigin> or a fetch()). -->
    <link rel="preconnect" href="https://esi.evetech.net" crossorigin />
    <link rel="preconnect" href="https://login.eveonline.com" crossorigin />
    <link rel="preconnect" href="https://images.evetech.net" />
    <link rel="preconnect" href="https://images.evetech.net" crossorigin />
    <!-- Matches --color-bg in src/styles/index.css — paints before any
         CSS/JS loads so a reload (deploy update or otherwise) never flashes
         the browser's default white background. -->
    <style>
      html,
      body {
        background-color: #0a0e14;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
