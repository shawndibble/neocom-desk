<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Neocom Desk</title>
    <!-- Warm the connections the first screen needs before the JS that asks
         for them has parsed. ESI and the SSO token endpoint are CORS fetches,
         and the image-server <img>s load with crossOrigin="anonymous" (so the
         service worker can cache them), so all three preconnects must be
         `crossorigin` to be reused. -->
    <link rel="preconnect" href="https://esi.evetech.net" crossorigin />
    <link rel="preconnect" href="https://login.eveonline.com" crossorigin />
    <link rel="preconnect" href="https://images.evetech.net" crossorigin />
    <!-- Matches --color-bg in src/styles/index.css — paints before any
         CSS/JS loads so a reload (deploy update or otherwise) never flashes
         the browser's default white background. -->
    <style>
      html,
      body {
        background-color: #0a0e14;
      }
    </style>
    <!-- Applies the stored text scale (src/lib/fontScale.ts) before the first
         paint, from the localStorage mirror that store keeps: its own Dexie
         hydrate lands a frame or more later, and every rem on the page would
         jump when it did. A classic script, so it runs before the module
         entry. The step list duplicates FONT_SCALE_STEPS, which
         src/app/indexHtmlFontScale.test.ts keeps in step. -->
    <script id="font-scale-boot">
      try {
        var s = Number(localStorage.getItem('neocom:font-scale'));
        if ([0.875, 1, 1.125, 1.25].indexOf(s) !== -1)
          document.documentElement.style.fontSize = s * 100 + '%';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
