<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Neocom Desk</title>
    <!-- Warm the connections the first screen needs before the JS that asks
         for them has parsed. ESI and the SSO token endpoint are CORS fetches,
         and the image-server <img>s load with crossOrigin="anonymous" (so the
         service worker can cache them), so all three preconnects must be
         `crossorigin` to be reused. -->
    <link rel="preconnect" href="https://esi.evetech.net" crossorigin />
    <link rel="preconnect" href="https://login.eveonline.com" crossorigin />
    <link rel="preconnect" href="https://images.evetech.net" crossorigin />
    <!-- Matches --color-bg in src/styles/index.css — paints before any
         CSS/JS loads so a reload (deploy update or otherwise) never flashes
         the browser's default white background. -->
    <style>
      html,
      body {
        background-color: #0a0e14;
      }
      /* While the prerendered landing hero stands in (#landing-shell-gate
         below), React renders under it unseen. src/app/landingShell.ts. */
      html[data-landing-shell] #root {
        display: none;
      }
    </style>
    <!-- Applies the stored text scale (src/lib/fontScale.ts) before the first
         paint, from the localStorage mirror that store keeps: its own Dexie
         hydrate lands a frame or more later, and every rem on the page would
         jump when it did. A classic script, so it runs before the module
         entry. The step list duplicates FONT_SCALE_STEPS, which
         src/app/indexHtmlFontScale.test.ts keeps in step. -->
    <script id="font-scale-boot">
      try {
        var s = Number(localStorage.getItem('neocom:font-scale'));
        if ([0.875, 1, 1.125, 1.25].indexOf(s) !== -1)
          document.documentElement.style.fontSize = s * 100 + '%';
      } catch (e) {}
    </script>
    <!-- Whether the prerendered landing hero (cloned in by #landing-shell-boot,
         src/app/landingShell.ts) stands in: only on the landing page's own
         paths, and never for a returning pilot (the signed-in hint,
         src/app/signedInShellHint.ts) or inside the Play Store app
         (src/lib/playStoreApp.ts), which get no marketing page. Decided here
         in <head>, ahead of the stylesheet, because a script after a
         stylesheet waits for it: the hero's ship starts loading now rather
         than once the CSS is in. Pinned by
         src/app/landingShellBootScript.test.ts. -->
    <script id="landing-shell-gate">
      try {
        var p = location.pathname;
        if (
          (p === '/' || p === '/login') &&
          localStorage.getItem('neocom:has-character') !== '1' &&
          sessionStorage.getItem('playStoreApp') !== '1' &&
          document.referrer.indexOf('android-app://com.neocomdesk.app') !== 0
        ) {
          document.documentElement.setAttribute('data-landing-shell', '');
          var l = document.createElement('link');
          l.rel = 'preload';
          l.setAttribute('as', 'image');
          l.href = '/landing/megathron.webp';
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }
      } catch (e) {}
    </script>
    <!-- Same cure as src/app/staleBuildRecovery.ts, for a build so stale that
         its own entry's static imports 404 — main.tsx never runs then, so no
         module code can react. Resource load errors do not bubble; capture
         sees them. Keys, the 60s window, the offline guard and the
         workbox-precache-only cache purge match that module (pinned by
         staleBuildBootScript.test.ts). -->
    <script id="stale-build-boot">
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (!t || t === window) return;
          var u = t.src || t.href || '';
          if (!/\/assets\/[^/]+\.js(\?|$)/.test(u)) return;
          if (navigator.onLine === false) return;
          try {
            var k = 'neocom:stale-build-purge-at';
            var n = Date.now();
            if (n - Number(sessionStorage.getItem(k) || 0) < 60000) return;
            sessionStorage.setItem(k, String(n));
          } catch (x) {
            return;
          }
          var go = function () {
            location.reload();
          };
          setTimeout(go, 3000);
          Promise.all([
            navigator.serviceWorker
              ? navigator.serviceWorker.getRegistrations().then(function (r) {
                  return Promise.all(
                    r.map(function (w) {
                      return w.unregister();
                    })
                  );
                })
              : 0,
            window.caches
              ? caches.keys().then(function (ks) {
                  return Promise.all(
                    ks
                      .filter(function (k2) {
                        return k2.indexOf('workbox-precache') === 0;
                      })
                      .map(function (k2) {
                        return caches.delete(k2);
                      })
                  );
                })
              : 0,
          ]).then(go, go);
        },
        true
      );
    </script>
  </head>
  <body>
    <!-- The landing page's header and hero as static HTML, so a first-time
         visitor sees them before any JS has loaded (#3926). vite.config.ts
         fills the template from src/features/landing/landingShell.snapshot.html;
         src/app/landingShell.ts explains the hand-off to React. -->
    <template id="landing-shell-template"><!-- landing-shell --></template>
    <!-- Clones the hero in where the gate in <head> chose it, appended where
         the parser is so it lands just before #root. An empty template (the
         marker never filled) shows #root after all. -->
    <script id="landing-shell-boot">
      try {
        var h = document.documentElement;
        var t = document.getElementById('landing-shell-template');
        if (h.hasAttribute('data-landing-shell')) {
          if (t.content.firstElementChild) {
            document.body.appendChild(t.content.cloneNode(true));
            h.setAttribute('data-landing-shell-shown', '');
          } else {
            h.removeAttribute('data-landing-shell');
          }
        }
      } catch (e) {
        document.documentElement.removeAttribute('data-landing-shell');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
