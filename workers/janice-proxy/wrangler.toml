name = "neocom-desk-janice-proxy"
main = "index.mjs"
compatibility_date = "2026-10-01"

# The app calls this from the browser, so it needs a public URL: the custom
# domain below, whose DNS record and certificate `wrangler deploy` creates.
workers_dev = false
preview_urls = false
routes = [{ pattern = "janice.neocomdesk.com", custom_domain = true }]

# Per-IP cap on appraisals; the one shared Janice key is what is being protected.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
